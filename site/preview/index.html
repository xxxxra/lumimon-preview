<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>るみもん</title>
<style>
:root{
  --ink:#263845;
  --sub:#6f818c;
  --blue:#72b5d3;
  --blue-deep:#397b9c;
  --yellow:#f3d56c;
  --line:rgba(70,111,134,.15);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef8fc}
body{
  min-height:100dvh;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
  background:
    linear-gradient(180deg,#dff2fb 0%,#eef8fc 42%,#fffdf7 100%);
}
a{color:inherit;text-decoration:none}
main{
  width:min(560px,100%);
  min-height:100dvh;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  padding:0 18px calc(28px + env(safe-area-inset-bottom));
}
.brand{
  position:relative;
  z-index:5;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding-top:calc(28px + env(safe-area-inset-top));
}
.brand-mark{
  width:14px;height:14px;
  position:relative;
  filter:drop-shadow(0 0 9px rgba(243,213,108,.65));
}
.brand-mark:before{
  content:"";
  position:absolute;
  inset:2px;
  background:var(--yellow);
  border-radius:2px;
  transform:rotate(45deg);
}
.brand h1{
  margin:0;
  font-size:30px;
  letter-spacing:.05em;
  font-weight:800;
}
.scene{
  position:relative;
  height:540px;
  margin:8px -18px 0;
}
.sun{
  position:absolute;
  top:42px;right:46px;
  width:82px;height:82px;
  border-radius:50%;
  background:radial-gradient(circle,#fff7c7 0%,rgba(250,226,130,.72) 42%,rgba(250,226,130,0) 72%);
  filter:blur(.2px);
}
.sparkles{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.sparkles span{
  position:absolute;
  width:4px;height:4px;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  box-shadow:0 0 8px rgba(255,255,255,.8);
}
.sparkles span:nth-child(1){left:14%;top:18%}
.sparkles span:nth-child(2){left:34%;top:11%;width:3px;height:3px}
.sparkles span:nth-child(3){left:65%;top:20%;width:3px;height:3px}
.sparkles span:nth-child(4){left:83%;top:31%;width:5px;height:5px}
.sparkles span:nth-child(5){left:24%;top:34%;width:3px;height:3px}
.hill{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
}
.hill-back{
  width:710px;height:170px;
  bottom:160px;
  background:#dcecf0;
}
.hill-mid{
  width:620px;height:190px;
  bottom:105px;
  margin-left:72px;
  background:#cfe5e4;
}
.hill-front{
  width:690px;height:185px;
  bottom:28px;
  margin-left:-84px;
  background:#e8eee0;
}
.ground{
  position:absolute;
  left:-40px;right:-40px;bottom:-34px;
  height:120px;
  background:linear-gradient(180deg,#f0f0e5 0%,#fffdf7 86%);
  border-radius:50% 50% 0 0 / 45% 45% 0 0;
}
.route{
  position:absolute;
  left:50%;
  top:62px;
  width:320px;
  height:330px;
  transform:translateX(-50%);
  pointer-events:none;
  z-index:2;
  overflow:visible;
}
.route-line{
  fill:none;
  stroke:url(#routeGradient);
  stroke-width:3;
  stroke-linecap:round;
  stroke-dasharray:2 10;
  opacity:.72;
}
.route-glow{
  fill:#fff6b6;
  filter:drop-shadow(0 0 8px rgba(243,213,108,.85));
}
.route-end{
  fill:#f1cf54;
  filter:drop-shadow(0 0 10px rgba(243,213,108,.8));
}
.main-action{
  position:absolute;
  z-index:4;
  left:50%;
  top:250px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:212px;
  height:64px;
  padding:0 28px;
  border-radius:999px;
  color:#fff;
  background:linear-gradient(180deg,#74b7d5 0%,#5da3c4 100%);
  box-shadow:
    0 14px 30px rgba(68,132,164,.22),
    0 0 0 7px rgba(255,255,255,.34);
  font-size:19px;
  font-weight:800;
  letter-spacing:.03em;
}
.main-action:before{
  content:"本編";
  position:absolute;
  top:-24px;
  left:50%;
  transform:translateX(-50%);
  color:var(--blue-deep);
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
}
.main-action:after{
  content:"›";
  margin-left:14px;
  font-size:24px;
  font-weight:400;
}
.memory{
  position:relative;
  z-index:6;
  margin-top:-22px;
  padding:0 2px;
}
.memory-label{
  margin:0 0 8px 2px;
  color:#7b8c95;
  font-size:12px;
  font-weight:800;
}
.memory-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:15px 2px 15px 0;
  border-top:1px solid rgba(77,112,131,.13);
  border-bottom:1px solid rgba(77,112,131,.13);
}
 .memory-link + .memory-link{border-top:0}
.memory-copy strong{
  display:block;
  margin-bottom:4px;
  font-size:16px;
}
.memory-copy span{
  display:block;
  color:var(--sub);
  font-size:12px;
  line-height:1.5;
}
.memory-arrow{
  flex:none;
  color:var(--blue-deep);
  font-size:24px;
  padding-right:6px;
}
details{
  position:relative;
  z-index:6;
  margin-top:18px;
}
summary{
  list-style:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 2px;
  color:#74838d;
  font-size:13px;
  font-weight:800;
}
summary::-webkit-details-marker{display:none}
summary::after{
  content:"＋";
  font-size:18px;
  font-weight:400;
}
details[open] summary::after{content:"−"}
.compare{
  display:grid;
  margin-top:4px;
  border-top:1px solid var(--line);
}
.compare a{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}
.compare strong{
  font-size:14px;
  font-weight:800;
}
.compare span{
  color:var(--sub);
  font-size:11px;
}
@media (hover:hover){
  .main-action:hover{transform:translateX(-50%) translateY(-1px)}
  .memory-link:hover .memory-arrow{transform:translateX(2px)}
}
@media (prefers-reduced-motion:no-preference){
  .route-end{
    animation:glow 3s ease-in-out infinite;
    transform-origin:center;
  }
  .sparkles span{
    animation:twinkle 4s ease-in-out infinite;
  }
  .sparkles span:nth-child(2){animation-delay:.8s}
  .sparkles span:nth-child(4){animation-delay:1.6s}
  @keyframes glow{0%,100%{opacity:.72}50%{opacity:1}}
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.95}}
}
@media (max-width:390px){
  .scene{height:510px}
  .main-action{top:238px;min-width:198px}
  .route{top:56px;width:300px;height:310px}
}
</style>
</head>
<body>
<main>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>るみもん</h1>
  </header>

  <section class="scene" aria-label="旅の入口">
    <div class="sun" aria-hidden="true"></div>
    <div class="sparkles" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="hill hill-back" aria-hidden="true"></div>
    <div class="hill hill-mid" aria-hidden="true"></div>
    <div class="hill hill-front" aria-hidden="true"></div>
    <div class="ground" aria-hidden="true"></div>

    <svg class="route" viewBox="0 0 320 330" aria-hidden="true">
      <defs>
        <linearGradient id="routeGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f4d86b" stop-opacity=".35"/>
          <stop offset="48%" stop-color="#ffffff" stop-opacity=".92"/>
          <stop offset="100%" stop-color="#72b5d3" stop-opacity=".42"/>
        </linearGradient>
      </defs>
      <path class="route-line" d="M246 18 C232 76 188 79 196 132 C205 189 127 179 131 238 C133 267 148 282 159 306"/>
      <circle class="route-glow" cx="246" cy="18" r="4"/>
      <circle class="route-glow" cx="196" cy="132" r="3.2"/>
      <circle class="route-glow" cx="131" cy="238" r="3.4"/>
      <path class="route-end" d="M159 295 L162.4 302.6 L170 306 L162.4 309.4 L159 317 L155.6 309.4 L148 306 L155.6 302.6 Z"/>
    </svg>

    <a class="main-action" href="../">つづきを見る</a>
  </section>

  <section class="memory">
    <div class="memory-label">おためし</div>
    <a class="memory-link" href="../experiments/start-highland-redesign-01/">
      <div class="memory-copy">
        <strong>新しいはじまりエリア</strong>
        <span>不採用・高台REDESIGN（履歴として保存）</span>
      </div>
      <span class="memory-arrow" aria-hidden="true">›</span>
    </a>
    <a class="memory-link" href="../experiments/start-village/">
      <div class="memory-copy">
        <strong>高台のはじまり村</strong>
        <span>過去の比較用・旧31×27版</span>
      </div>
      <span class="memory-arrow" aria-hidden="true">›</span>
    </a>
    <a class="memory-link" href="../experiments/memory/">
      <div class="memory-copy">
        <strong>旅のきおく</strong>
        <span>相棒が、旅のことを少しずつ覚える</span>
      </div>
      <span class="memory-arrow" aria-hidden="true">›</span>
    </a>
  </section>

  <details>
    <summary>過去のはじまりエリア・没案をすべて見る</summary>
    <div class="compare">
      <a href="../experiments/start-village-exp08-faithful-02/"><strong>EXP08 忠実移植</strong><span>過去候補</span></a>
      <a href="../experiments/start-village-exp08-hybrid/"><strong>EXP08 ハイブリッド</strong><span>過去候補</span></a>
      <a href="../experiments/start-village-living-water-03/"><strong>水辺・暮らし</strong><span>過去候補</span></a>
      <a href="../experiments/start-village-home-grammar-01/"><strong>家の構成</strong><span>実験</span></a>
      <a href="../experiments/start-village-building-polish-01/"><strong>建物 POLISH</strong><span>実験</span></a>
      <a href="../experiments/start-village-building-grammar-01/"><strong>建物構成</strong><span>実験</span></a>
      <a href="../experiments/start-village-building-grammar-entrance-fix-01/"><strong>建物入口修正</strong><span>実験</span></a>
      <a href="../experiments/start-highland-redesign-01/checkpoints/e773b76/"><strong>高台 REDESIGN 過去版</strong><span>不採用・履歴</span></a>
      <a href="../experiments/"><strong>全実験版の一覧</strong><span>履歴も含めて見る</span></a>
    </div>
  </details>

  <details>
    <summary>見くらべる</summary>
    <div class="compare">
      <a href="../candidate/l44-progression-safe.html">
        <strong>前の版</strong>
        <span>いまの本編と見くらべる</span>
      </a>
      <a href="../reference/golden-master/shiokaze/sio3-4.html">
        <strong>シオカゼ</strong>
        <span>町の見た目</span>
      </a>
      <a href="../reference/golden-master/snow/luminaria_snow_village_premium.html">
        <strong>雪の村</strong>
        <span>雪エリアの見た目</span>
      </a>
    </div>
  </details>
</main>
</body>
</html>
