<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>るみもん</title>
<style>
:root{
  --ink:#243746;
  --sub:#6e7f8c;
  --line:rgba(74,111,134,.14);
  --blue:#7bb8d6;
  --blue-deep:#3d7fa1;
  --sky:#eef8fc;
  --cream:#fffdf8;
  --yellow:#f7d86a;
  --card:#ffffff;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:
    radial-gradient(circle at 78% 8%, rgba(247,216,106,.26) 0 44px, transparent 45px),
    radial-gradient(circle at 14% 18%, rgba(123,184,214,.16) 0 60px, transparent 61px),
    linear-gradient(180deg,#eaf6fb 0%,#f7fbfd 38%,#fffdf8 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
}
body:before,
body:after{
  content:"";
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  opacity:.7;
}
body:before{
  width:7px;height:7px;
  background:#fff7bd;
  box-shadow:38px 20px 0 -1px #fff,92px 4px 0 -2px #fff7bd,132px 48px 0 -1px #fff,205px 18px 0 -2px #fff7bd;
  top:30px;left:24px;
}
body:after{
  width:5px;height:5px;
  background:#fff;
  box-shadow:56px 34px 0 -1px #fff5a8,118px 8px 0 -1px #fff,176px 42px 0 -1px #fff5a8;
  top:76px;right:24px;
}
main{
  width:min(560px,100%);
  margin:0 auto;
  padding:30px 18px 56px;
  position:relative;
}
.hero{
  padding:14px 4px 26px;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
}
.spark{
  width:24px;height:24px;
  position:relative;
  flex:none;
}
.spark:before,
.spark:after{
  content:"";
  position:absolute;
  inset:50% auto auto 50%;
  background:var(--yellow);
  border-radius:999px;
  transform:translate(-50%,-50%);
}
.spark:before{width:7px;height:24px}
.spark:after{width:24px;height:7px}
h1{
  margin:0;
  font-size:30px;
  letter-spacing:.03em;
  font-weight:800;
}
.hero p{
  margin:10px 0 0 34px;
  color:var(--sub);
  font-size:14px;
  letter-spacing:.01em;
}
a{color:inherit;text-decoration:none}
.journey{
  display:block;
  position:relative;
  overflow:hidden;
  padding:22px 20px 20px;
  min-height:142px;
  border-radius:24px;
  background:
    radial-gradient(circle at 86% 24%,rgba(247,216,106,.42) 0 34px,transparent 35px),
    linear-gradient(145deg,#ffffff 0%,#f5fbfe 58%,#e6f5fb 100%);
  border:1px solid rgba(94,153,184,.2);
  box-shadow:0 14px 32px rgba(66,111,136,.12);
}
.journey:after{
  content:"";
  position:absolute;
  right:-14px;
  bottom:-20px;
  width:150px;
  height:84px;
  border:2px solid rgba(80,145,177,.13);
  border-radius:50%;
  transform:rotate(-10deg);
}
.eyebrow{
  display:block;
  color:var(--blue-deep);
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:10px;
}
.journey strong{
  display:block;
  font-size:22px;
  line-height:1.35;
  margin-bottom:5px;
}
.journey .sub{
  display:block;
  color:var(--sub);
  font-size:13px;
}
.go{
  position:absolute;
  right:18px;
  bottom:18px;
  width:38px;height:38px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff;
  color:var(--blue-deep);
  box-shadow:0 6px 16px rgba(72,125,151,.14);
  font-size:24px;
}
.section-title{
  margin:28px 4px 11px;
  color:#617582;
  font-size:13px;
  font-weight:800;
}
.card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:16px 16px 16px 17px;
  background:rgba(255,255,255,.88);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 6px 18px rgba(60,92,111,.055);
}
.card strong{
  display:block;
  font-size:16px;
  margin-bottom:4px;
}
.card span{
  display:block;
  color:var(--sub);
  font-size:12px;
  line-height:1.55;
}
.tag{
  display:inline-block!important;
  width:max-content;
  margin-bottom:7px;
  padding:3px 8px;
  border-radius:999px;
  background:#fff6c9;
  color:#806a15!important;
  font-size:10px!important;
  font-weight:800;
}
.mini-go{
  flex:none;
  width:31px;height:31px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#edf7fb;
  color:var(--blue-deep);
  font-size:19px;
}
details{margin-top:22px}
summary{
  cursor:pointer;
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 4px;
  color:#71818c;
  font-size:13px;
  font-weight:800;
}
summary::-webkit-details-marker{display:none}
summary::after{
  content:"＋";
  font-size:19px;
  font-weight:400;
}
details[open] summary::after{content:"−"}
.compare{
  display:grid;
  gap:9px;
  padding-top:2px;
}
.compare .card{
  padding:14px 15px;
  box-shadow:none;
  background:rgba(255,255,255,.7);
}
.compare .card strong{
  font-size:14px;
  margin-bottom:2px;
}
.compare .card span{font-size:11px}
.footer{
  margin:34px 0 0;
  text-align:center;
  color:#9aa8b1;
  font-size:11px;
}
@media (hover:hover){
  .journey:hover,.card:hover{transform:translateY(-1px)}
}
@media (max-width:380px){
  main{padding-left:15px;padding-right:15px}
  .journey strong{font-size:20px}
}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="logo">
      <span class="spark" aria-hidden="true"></span>
      <h1>るみもん</h1>
    </div>
    <p>きょうはどこ見る？</p>
  </header>

  <a class="journey" href="../">
    <span class="eyebrow">いまのるみもん</span>
    <strong>つづきを見る</strong>
    <span class="sub">いま遊べる本編</span>
    <span class="go" aria-hidden="true">›</span>
  </a>

  <div class="section-title">おためし</div>
  <a class="card" href="../experiments/memory/">
    <div>
      <span class="tag">おためし中</span>
      <strong>旅のきおく</strong>
      <span>相棒が、旅のことを少しずつ覚える</span>
    </div>
    <span class="mini-go" aria-hidden="true">›</span>
  </a>

  <details>
    <summary>見くらべる</summary>
    <div class="compare">
      <a class="card" href="../candidate/l44-progression-safe.html">
        <div>
          <strong>前の基準</strong>
          <span>本編と見くらべたいとき</span>
        </div>
        <span class="mini-go" aria-hidden="true">›</span>
      </a>
      <a class="card" href="../reference/golden-master/shiokaze/sio3-4.html">
        <div>
          <strong>シオカゼ</strong>
          <span>町の見た目</span>
        </div>
        <span class="mini-go" aria-hidden="true">›</span>
      </a>
      <a class="card" href="../reference/golden-master/snow/luminaria_snow_village_premium.html">
        <div>
          <strong>雪の村</strong>
          <span>雪エリアの見た目</span>
        </div>
        <span class="mini-go" aria-hidden="true">›</span>
      </a>
    </div>
  </details>

  <div class="footer">またここから。</div>
</main>
</body>
</html>
