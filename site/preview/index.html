<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>るみもん</title>
<style>
:root{
  --ink:#233746;
  --sub:#74838d;
  --line:rgba(76,112,133,.14);
  --blue:#6faecf;
  --blue-deep:#397b9d;
  --sky:#edf8fc;
  --cream:#fffdf8;
  --yellow:#f4cf59;
  --card:#fff;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:
    linear-gradient(180deg,#ebf7fb 0%,#f7fbfd 32%,#fffdf8 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
}
main{
  width:min(560px,100%);
  margin:0 auto;
  padding:34px 18px 58px;
}
.hero{
  padding:6px 5px 30px;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
}
.glint{
  position:relative;
  width:18px;
  height:18px;
  flex:none;
  filter:drop-shadow(0 0 8px rgba(244,207,89,.45));
}
.glint:before{
  content:"";
  position:absolute;
  left:50%;top:50%;
  width:11px;height:11px;
  background:var(--yellow);
  border-radius:2px;
  transform:translate(-50%,-50%) rotate(45deg);
}
.glint:after{
  content:"";
  position:absolute;
  left:50%;top:50%;
  width:3px;height:3px;
  background:#fff9cf;
  border-radius:50%;
  transform:translate(-50%,-50%);
}
h1{
  margin:0;
  font-size:31px;
  letter-spacing:.035em;
  font-weight:800;
}
a{color:inherit;text-decoration:none}
.journey{
  display:block;
  position:relative;
  overflow:hidden;
  min-height:148px;
  padding:24px 22px;
  border-radius:25px;
  background:
    linear-gradient(145deg,#ffffff 0%,#f7fcfe 62%,#edf8fc 100%);
  border:1px solid rgba(93,150,179,.22);
  box-shadow:0 14px 32px rgba(66,111,136,.11);
}
.journey-label{
  display:block;
  margin-bottom:12px;
  color:var(--blue-deep);
  font-size:12px;
  font-weight:800;
  letter-spacing:.06em;
}
.journey strong{
  display:block;
  position:relative;
  z-index:2;
  width:max-content;
  font-size:24px;
  line-height:1.3;
}
.go{
  position:absolute;
  right:19px;
  bottom:18px;
  z-index:3;
  width:39px;height:39px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff;
  color:var(--blue-deep);
  box-shadow:0 6px 16px rgba(72,125,151,.14);
  font-size:24px;
}
.light-route{
  position:absolute;
  width:186px;
  height:112px;
  right:34px;
  top:10px;
  opacity:.84;
  pointer-events:none;
}
.route-line{
  fill:none;
  stroke:url(#routeGlow);
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-dasharray:1 8;
}
.route-dot{
  fill:#fff7b8;
  filter:drop-shadow(0 0 5px rgba(244,207,89,.72));
}
.route-star{
  fill:#f4cf59;
  filter:drop-shadow(0 0 7px rgba(244,207,89,.55));
}
.section-title{
  margin:29px 4px 11px;
  color:#667985;
  font-size:13px;
  font-weight:800;
}
.card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:17px;
  background:rgba(255,255,255,.88);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 6px 18px rgba(60,92,111,.05);
}
.card strong{
  display:block;
  font-size:16px;
  margin-bottom:4px;
}
.card span{
  display:block;
  color:var(--sub);
  font-size:12px;
  line-height:1.55;
}
.mini-go{
  flex:none;
  width:31px;height:31px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#edf7fb;
  color:var(--blue-deep);
  font-size:19px;
}
details{margin-top:22px}
summary{
  cursor:pointer;
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 4px;
  color:#71818c;
  font-size:13px;
  font-weight:800;
}
summary::-webkit-details-marker{display:none}
summary::after{
  content:"＋";
  font-size:19px;
  font-weight:400;
}
details[open] summary::after{content:"−"}
.compare{
  display:grid;
  gap:9px;
  padding-top:2px;
}
.compare .card{
  padding:14px 15px;
  box-shadow:none;
  background:rgba(255,255,255,.7);
}
.compare .card strong{
  font-size:14px;
  margin-bottom:2px;
}
.compare .card span{font-size:11px}
@media (hover:hover){
  .journey:hover,.card:hover{transform:translateY(-1px)}
}
@media (prefers-reduced-motion:no-preference){
  .route-star{
    animation:softGlow 3.8s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes softGlow{
    0%,100%{opacity:.74}
    50%{opacity:1}
  }
}
@media (max-width:380px){
  main{padding-left:15px;padding-right:15px}
  .journey strong{font-size:22px}
  .light-route{right:14px}
}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="logo">
      <span class="glint" aria-hidden="true"></span>
      <h1>るみもん</h1>
    </div>
  </header>

  <a class="journey" href="../">
    <span class="journey-label">本編</span>
    <strong>つづきを見る</strong>

    <svg class="light-route" viewBox="0 0 186 112" aria-hidden="true">
      <defs>
        <linearGradient id="routeGlow" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f4cf59" stop-opacity=".18"/>
          <stop offset="52%" stop-color="#8fc8df" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#6faecf" stop-opacity=".12"/>
        </linearGradient>
      </defs>
      <path class="route-line" d="M20 18 C52 18 51 51 86 48 S126 78 164 82"/>
      <circle class="route-dot" cx="21" cy="18" r="3.4"/>
      <circle class="route-dot" cx="86" cy="48" r="2.8"/>
      <path class="route-star" d="M163 74 L165.8 80.2 L172 83 L165.8 85.8 L163 92 L160.2 85.8 L154 83 L160.2 80.2 Z"/>
    </svg>

    <span class="go" aria-hidden="true">›</span>
  </a>

  <div class="section-title">おためし</div>
  <a class="card" href="../experiments/memory/">
    <div>
      <strong>旅のきおく</strong>
      <span>相棒が、旅のことを少しずつ覚える</span>
    </div>
    <span class="mini-go" aria-hidden="true">›</span>
  </a>

  <details>
    <summary>見くらべる</summary>
    <div class="compare">
      <a class="card" href="../candidate/l44-progression-safe.html">
        <div>
          <strong>前の版</strong>
          <span>いまの本編と見くらべる</span>
        </div>
        <span class="mini-go" aria-hidden="true">›</span>
      </a>
      <a class="card" href="../reference/golden-master/shiokaze/sio3-4.html">
        <div>
          <strong>シオカゼ</strong>
          <span>町の見た目</span>
        </div>
        <span class="mini-go" aria-hidden="true">›</span>
      </a>
      <a class="card" href="../reference/golden-master/snow/luminaria_snow_village_premium.html">
        <div>
          <strong>雪の村</strong>
          <span>雪エリアの見た目</span>
        </div>
        <span class="mini-go" aria-hidden="true">›</span>
      </a>
    </div>
  </details>
</main>
</body>
</html>
