<html lang="ja">

<title>るみもん｜旅のきおく 試遊版</title>
<style>
:root{--ink:#e2e8f0;--muted:#94a3b8;--line:rgba(255,255,255,.10);--glass:rgba(15,23,42,.92);--blue:#38bdf8;--blue2:#0ea5e9;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060913;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;max-width:600px;height:100dvh;background:#000;display:flex;flex-direction:column;overflow:hidden}
#game-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
canvas#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;max-height:100%}
#hud{position:absolute;left:0;top:10px;pointer-events:none;z-index:8;transition:opacity .25s}

.badge b{display:block;font-size:11px;margin-bottom:2px}
#hud-actions{display:none}
#toast{position:absolute;top:56px;left:50%;transform:translate(-50%,-8px);opacity:0;transition:.25s;z-index:9;background:rgba(2,8,18,.82);border:1px solid rgba(190,225,255,.2);border-radius:14px;padding:7px 12px;font-size:11px;line-height:1.45;max-width:88%;text-align:center;white-space:normal;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#dialog{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(92%,520px);display:none;z-index:20;background:rgba(5,10,19,.96);border:1px solid rgba(126,163,194,.72);border-radius:8px;padding:18px 15px 14px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
#dialog.show{display:block}
#dialog-name{display:none;margin:-9px 0 7px;color:#8fd1ff;font-size:11px;font-weight:800;letter-spacing:.04em}
#dialog-text{font-size:14px;line-height:1.62;white-space:pre-wrap;min-height:44px;padding-right:8px}
#dialog-next{position:absolute;right:12px;bottom:8px;font-size:10px;color:#8bd1ff;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:.25}}
#modal{position:absolute;inset:0;display:none;z-index:30;background:rgba(0,2,7,.80);padding:18px;align-items:center;justify-content:center}
#modal.show{display:flex}
.panel{width:min(94%,520px);max-height:88%;overflow:auto;background:#09111e;border:1px solid rgba(135,178,211,.48);border-radius:10px;padding:18px;box-shadow:0 18px 54px rgba(0,0,0,.68)}
.panel h1,.panel h2{margin:0}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.18em;color:#79c7ff;margin-bottom:8px}.panel h1{font-size:24px;line-height:1.25}.panel .sub{font-size:12px;line-height:1.6;color:var(--muted);margin:10px 0 16px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bond-choices{grid-template-columns:repeat(2,1fr)}.choice{appearance:none;border:1px solid rgba(145,184,214,.28);background:#0c1726;border-radius:8px;padding:11px 6px 9px;color:#eef7ff;font:inherit;cursor:pointer}.choice.active{border-color:#7dd3fc;background:#10263a;box-shadow:inset 0 0 0 1px rgba(125,211,252,.18)}.mini-sprite{width:64px;height:64px;margin:0 auto 5px;image-rendering:pixelated}.choice b{display:block;font-size:13px}.choice span{display:block;font-size:9px;color:#98abc0;margin-top:4px}
.primary{width:100%;margin-top:14px;border:1px solid #7dd3fc;border-radius:8px;padding:13px 14px;background:#1479aa;color:#effbff;font-weight:900;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}.secondary{width:100%;margin-top:8px;border:1px solid rgba(145,184,214,.30);border-radius:8px;padding:11px 14px;background:#0c1726;color:#dcecff;font-weight:800;cursor:pointer}.menu-list{display:grid;gap:8px;margin-top:14px}.menu-list button{text-align:left}
.memory-card{border-radius:8px;border:1px solid rgba(145,184,214,.28);background:#0c1726;padding:14px;margin-top:12px}.memory-head{display:flex;align-items:center;gap:12px}.token{width:42px;height:42px;display:grid;place-items:center;border-radius:6px;background:#102236;border:1px solid rgba(145,184,214,.24);font-size:23px}.memory-card h3{margin:0;font-size:15px}.memory-card small{color:#8ea5bc}.memory-body{margin-top:12px;color:#d9e7f4;font-size:13px;line-height:1.7}.empty{padding:24px 12px;text-align:center;color:#8ea5bc;font-size:13px;line-height:1.7}
#controls{height:160px;flex:0 0 auto;padding:0 30px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#0b0f19,#04060a);border-top:1px solid rgba(255,255,255,.05);z-index:12}

#buttons{display:flex;flex-direction:column;align-items:center;gap:10px}#actionRow{display:flex;align-items:flex-end;gap:12px}.round{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:white;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.14);cursor:pointer;touch-action:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}.round.pressed{transform:translateY(1px) scale(.98);filter:brightness(1.08)}#bBtn{width:50px;height:50px;background:linear-gradient(135deg,rgba(239,68,68,.28),rgba(185,28,28,.35));border-color:rgba(248,113,113,.32);font-size:11px}#aBtn{width:64px;height:64px;margin-bottom:0;background:linear-gradient(135deg,rgba(34,197,94,.28),rgba(22,163,74,.35));border-color:rgba(74,222,128,.32);font-size:18px}.btnlabel{pointer-events:none;text-align:center;line-height:1}.btnlabel small{display:none}#menuBtn{min-width:88px;height:34px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;font-size:11px;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.08);cursor:pointer}
@media(min-width:768px){#controls{display:none}#app{height:min(92vh,760px);border-radius:22px;border:1px solid rgba(170,215,255,.15);box-shadow:0 25px 90px rgba(0,0,0,.65)}#dialog{bottom:24px}}

 boss_d:["...dddddd...","..dDDDDDDd..","..dDDDDDDd..",".sSSSSSSSSs.",".sSxSSSSxSs.",".sSVVVVVVSs.","..dDDDDDDd..","..dDvvvvDd..","...dDDDDd...","...d.dd.d..."],

 boss_l:["...dddddd...","..dDDDDDDd..","..dDDDDDDd..",".sSSSSSSSSs.",".sSxSSSSSSs.",".sSVVVVVVSs.","..dDDDDDDd..","..dDvvvvDd..","...dDDDDd...","...d.dd.d..."],

};
function drawCharSprite(ctx,data,x,y,scale=1){for(let r=0;r<data.length;r++)for(let c=0;c<data[r].length;c++){const col=MAIN_PAL[data[r][c]];if(col){ctx.fillStyle=col;ctx.fillRect(Math.round(x+c*scale),Math.round(y+r*scale),scale,scale)}}}

const BUDDIES={
 penta:{name:'ぺんた',type:'みず',note:'雪、だいすき',token:'❄',cols:['#38bdf8','#7dd3fc','#fff','#facc15'],first:'ぺんたが 雪に とびこんだ。',after:'また とびこんだ。',memory1:'はじめての雪。ぺんたは、そのまま雪の中へ飛びこんだ。',memory2:'同じ場所へ戻ると、また雪へ。ここが好きらしい。'},
 puwawa:{name:'ぷわわ',type:'かぜ',note:'ふわっと様子見',token:'◌',cols:['#7dd3fc','#bae6fd','#fff','#a5f3fc'],first:'ぷわわが 雪に そっとふれた。',after:'くるっと回って、雪へ降りた。',memory1:'白い雪に、ぷわわがそっと触れた。',memory2:'戻ってくると、雪の上を一周してから同じ場所へ降りた。'},
 yamiusa:{name:'ヤミウサ',type:'やみ',note:'気になるけど慎重',token:'☾',cols:['#27234f','#4f46e5','#f3e8ff','#ef4444'],first:'ヤミウサが 前足で 雪をさわった。',after:'通りすぎて――戻ってきた。\nもう一度、前足でさわった。',memory1:'ヤミウサは雪を見て、前足で一度だけ触った。',memory2:'再び通ると一度は通りすぎた。でも戻ってきて、また触った。'}
};
const S={mode:'select',map:'village',buddyKey:'penta',pendingBuddy:'penta',bond:'new',px:4,py:13,opx:4,opy:13,face:'r',moveT:0,history:[{x:3,y:13},{x:2,y:13}],comp:{x:3,y:13,tx:3,ty:13,route:[],routeGoal:null,returnDelay:0,callGoal:null,callArrive:'',callWatch:false,react:'',reactTimer:0,idleKind:'',idleTimer:0},dialog:null,dialogName:'',dialogDone:null,msgI:0,firstDone:false,leftAfterMemory:false,revisitReady:false,revisitDone:false,notice:false,eventAnim:0,eventPhase:0,memoryOpen:false,frame:0,footprints:[],cprints:[],snow:[],idle:0,idleNext:170,playerReactTimer:0,playerLookDir:null,detour:{active:false,kind:'',phase:'',timer:0,cooldown:240,target:null,anchor:null,stepTimer:0,lookTimer:0},npcMet:false,npcRemembered:false,npcDir:'d',restDone:false,restAnim:0,battleDone:false,battleRevisit:false,battleRevisitDone:false,battleRevisitCue:false,battleAnim:0,threatSeen:false,threatReactTimer:0,threatComforted:false,threatDir:'l',bossStandoff:false};
const maps={
 village:{name:'スノーヴィレッジ',spawn:{x:4,y:13},exit:{x:16,y:11,to:'path',tx:1,ty:11},spot:{x:11,y:9},rest:{x:4,y:10},npc:{x:6,y:9},detours:{
 penta:[{x:6,y:12,kind:'snowman'},{x:10,y:16,kind:'icepond'},{x:5,y:16,kind:'snowtree'}],
 puwawa:[{x:13,y:10,kind:'lamp'},{x:5,y:9,kind:'lamp2'},{x:12,y:15,kind:'treetop'}],
 yamiusa:[{x:10,y:16,kind:'ice'},{x:2,y:15,kind:'shadowtree'},{x:12,y:17,kind:'quietcorner'}]
},blocked:[...rect(0,0,17,2),...rect(0,19,17,2),...rect(0,0,1,21),...rect(6,3,5,4),...rect(2,4,3,3),...rect(13,4,3,4),...rect(8,14,2,3),...rect(13,14,3,3),'6,9','4,10']},
 path:{name:'ゆきみち',spawn:{x:1,y:11},exit:{x:0,y:11,to:'village',tx:15,ty:11},battle:{x:12,y:10},threat:{x:12,y:10},blocked:[...rect(0,0,17,3),...rect(0,18,17,3),...rect(5,4,3,3),...rect(11,4,4,3),...rect(8,13,5,3),'12,10']}
};
function rect(x,y,w,h){const a=[];for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)a.push(xx+','+yy);return a}
function blocked(map,x,y){if(y<2||y>18)return true;if(x<0||x>=MAP_W)return true;return maps[map].blocked.includes(x+','+y)}
function openGoal(map,gx,gy){
 gx=Math.max(0,Math.min(MAP_W-1,Math.round(gx)));gy=Math.max(2,Math.min(18,Math.round(gy)));
 if(!blocked(map,gx,gy))return{x:gx,y:gy};
 for(let r=1;r<=3;r++)for(const [dx,dy] of [[r,0],[-r,0],[0,r],[0,-r],[r,r],[-r,r],[r,-r],[-r,-r]]){const x=gx+dx,y=gy+dy;if(!blocked(map,x,y))return{x,y}}
 return null;
}
function findPath(map,sx,sy,gx,gy){
 const g=openGoal(map,gx,gy);if(!g)return[];
 sx=Math.max(0,Math.min(MAP_W-1,Math.round(sx)));sy=Math.max(2,Math.min(18,Math.round(sy)));
 const sk=sx+','+sy,gk=g.x+','+g.y;if(sk===gk)return[{x:sx,y:sy}];
 const q=[{x:sx,y:sy}],prev=new Map([[sk,null]]),dirs=[[1,0],[-1,0],[0,1],[0,-1]];
 for(let qi=0;qi<q.length;qi++){const p=q[qi];for(const [dx,dy] of dirs){const x=p.x+dx,y=p.y+dy,k=x+','+y;if(prev.has(k)||blocked(map,x,y))continue;prev.set(k,p.x+','+p.y);if(k===gk){const out=[{x:g.x,y:g.y}];let cur=prev.get(k);while(cur){const [cx,cy]=cur.split(',').map(Number);out.push({x:cx,y:cy});cur=prev.get(cur)}return out.reverse()}q.push({x,y})}}
 return[];
}
function setCompGoal(x,y,force=false){
 const g=openGoal(S.map,x,y);if(!g)return;
 const key=g.x+','+g.y;if(!force&&S.comp.routeGoal===key&&S.comp.route.length)return;
 const p=findPath(S.map,S.comp.x,S.comp.y,g.x,g.y);S.comp.route=p.slice(1);S.comp.routeGoal=key;S.comp.tx=g.x;S.comp.ty=g.y;
}
function setCompEmotion(symbol,timer=56){S.comp.react=symbol;S.comp.reactTimer=Math.max(S.comp.reactTimer,timer)}
function dirToward(ax,ay,bx,by){const dx=bx-ax,dy=by-ay;if(Math.abs(dx)>Math.abs(dy))return dx<0?'l':'r';return dy<0?'u':'d'}
function playerWatchComp(timer=46){if(S.moveT>0||S.mode!=='world')return;S.playerLookDir=dirToward(S.px,S.py,S.comp.x,S.comp.y);S.playerReactTimer=timer}
function finishCallArrival(){
 if(!S.comp.callWatch)return;
 S.comp.callWatch=false;playerWatchComp(54);
 if(S.comp.callArrive)setCompEmotion(S.comp.callArrive,52);
 S.comp.callArrive='';
}
function startCompIdle(){
 const k=S.buddyKey,roll=Math.random();
 S.comp.idleKind=k==='penta'?(roll<.58?'peck':'look'):k==='puwawa'?(roll<.62?'float':'circle'):(roll<.62?'watch':'sit');
 S.comp.idleTimer=105+Math.floor(Math.random()*75);
 if(S.comp.idleKind==='float'&&Math.random()<.45)setCompEmotion('♪',52);
 if(S.comp.idleKind==='watch'&&Math.random()<.45){setCompEmotion('…',46);playerWatchComp(54)}
 if(S.comp.idleKind==='peck'&&Math.random()<.22)setCompEmotion('♪',44);
}
function compFollowPoint(){
 const idx=S.bond==='close'?0:Math.min(2,S.history.length-1);const h=S.history[idx]||{x:S.px-1,y:S.py};
 return openGoal(S.map,h.x,h.y)||{x:S.px,y:S.py};
}
function advanceComp(speed){
 if(S.comp.returnDelay>0){S.comp.returnDelay--;if(S.comp.returnDelay===0&&S.comp.callGoal){setCompGoal(S.comp.callGoal.x,S.comp.callGoal.y,true);S.comp.callGoal=null;if(S.comp.route.length===0)finishCallArrival()}return}
 const n=S.comp.route[0];if(!n)return;const dx=n.x-S.comp.x,dy=n.y-S.comp.y,d=Math.hypot(dx,dy);
 if(d<=speed+.03){
   S.comp.x=n.x;S.comp.y=n.y;S.comp.route.shift();if(S.map==='village'||S.map==='path')S.cprints.push({map:S.map,x:n.x,y:n.y,life:210});
   if(S.comp.route.length===0&&S.comp.callWatch)finishCallArrival()
   return;
 }
 S.comp.x+=dx/d*speed;S.comp.y+=dy/d*speed;
}
function initSnow(){S.snow=[];for(let i=0;i<120;i++)S.snow.push({x:Math.random()*GW,y:Math.random()*GH,s:.4+Math.random()*1.4,v:.25+Math.random()*.65,a:.18+Math.random()*.55,drift:(Math.random()-.5)*.25})}

function drawSnow(){X.save();for(const p of S.snow){X.globalAlpha=p.a;X.fillStyle='#fff';X.fillRect(p.x,p.y,p.s,p.s)}X.globalAlpha=1;X.restore()}
let keys={};document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();if(e.key==='Enter'||e.key==='z'||e.key===' ')tryAction();if(e.key==='x')callBuddy();if(e.key==='m'&&S.mode==='world')openMenu();if(e.key==='Escape'){if(S.dialog)advanceMsg();else if(['memory','bond','menu'].includes(S.mode))closeModal()}});document.addEventListener('keyup',e=>keys[e.key]=false);
setInterval(()=>{if(S.mode!=='world'||S.dialog||S.eventAnim>0)return;if(keys.ArrowUp||keys.w)tryMove('u');else if(keys.ArrowDown||keys.s)tryMove('d');else if(keys.ArrowLeft||keys.a)tryMove('l');else if(keys.ArrowRight||keys.d)tryMove('r')},85);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let joy=false,joyDir=null,joyTimer=null;function joyUpdate(cx,cy){const r=stick.getBoundingClientRect(),dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2),d=Math.hypot(dx,dy),max=32,k=d>max?max/d:1;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;joyDir=d<11?null:(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))}
function joyStart(e){e.preventDefault();joy=true;const t=e.touches?e.touches[0]:e;joyUpdate(t.clientX,t.clientY);clearInterval(joyTimer);joyTimer=setInterval(()=>{if(joy&&joyDir)tryMove(joyDir)},88);if(joyDir)tryMove(joyDir)}function joyMove(e){if(!joy)return;e.preventDefault();const t=e.touches?e.touches[0]:e;joyUpdate(t.clientX,t.clientY)}function joyEnd(e){if(e)e.preventDefault();joy=false;joyDir=null;knob.style.transform='translate(0,0)';clearInterval(joyTimer)}
stick.addEventListener('touchstart',joyStart,{passive:false});stick.addEventListener('touchmove',joyMove,{passive:false});stick.addEventListener('touchend',joyEnd,{passive:false});stick.addEventListener('touchcancel',joyEnd,{passive:false});stick.addEventListener('mousedown',joyStart);window.addEventListener('mousemove',joyMove);window.addEventListener('mouseup',joyEnd);
function bindRound(id,fn){const b=document.getElementById(id);const down=e=>{e.preventDefault();b.classList.add('pressed');fn()};const up=e=>{e.preventDefault();b.classList.remove('pressed')};b.addEventListener('touchstart',down,{passive:false});b.addEventListener('touchend',up,{passive:false});b.addEventListener('touchcancel',up,{passive:false});b.addEventListener('mousedown',down);b.addEventListener('mouseup',up);b.addEventListener('mouseleave',up)}bindRound('aBtn',tryAction);bindRound('bBtn',()=>{if(S.dialog)advanceMsg();else if(['memory','bond','menu'].includes(S.mode))closeModal();else callBuddy()});
function resize(){const wrap=document.getElementById('game-wrap'),w=wrap.clientWidth,h=wrap.clientHeight,sc=Math.min(w/GW,h/GH);C.style.width=Math.floor(GW*sc)+'px';C.style.height=Math.floor(GH*sc)+'px'}window.addEventListener('resize',resize);resize();updateHud();openSelect(true);requestAnimationFrame(loop);
</script>
