<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>るみもん｜旅のきおく EXPERIMENT / visual-aligned</title>
<style>
:root{--ink:#e2e8f0;--muted:#94a3b8;--line:rgba(255,255,255,.10);--glass:rgba(15,23,42,.92);--blue:#38bdf8;--blue2:#0ea5e9;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060913;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;max-width:600px;height:100dvh;background:#000;display:flex;flex-direction:column;overflow:hidden}
#game-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#14243c 0,#050910 62%,#020308 100%)}
canvas#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;max-height:100%}
#hud{position:absolute;inset:10px 10px auto 10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:8}
.badge,.hudbtn{background:rgba(5,12,24,.74);border:1px solid rgba(180,220,255,.22);box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:13px;color:#eaf7ff}
.badge{padding:7px 10px;font-size:11px;line-height:1.25;letter-spacing:.04em}
.badge b{display:block;font-size:12px;margin-bottom:2px}
#hud-actions{display:flex;gap:7px;pointer-events:auto}
.hudbtn{border-radius:11px;padding:8px 10px;font-size:11px;font-weight:800;cursor:pointer}
#toast{position:absolute;top:56px;left:50%;transform:translate(-50%,-8px);opacity:0;transition:.25s;z-index:9;background:rgba(2,8,18,.76);border:1px solid rgba(190,225,255,.2);border-radius:999px;padding:6px 12px;font-size:11px;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#dialog{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(92%,520px);display:none;z-index:20;background:rgba(7,14,28,.91);border:1px solid rgba(126,202,255,.38);border-radius:15px;padding:17px 16px 15px;box-shadow:0 18px 45px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#dialog.show{display:block}
#dialog-name{position:absolute;left:14px;top:-11px;background:linear-gradient(135deg,#a7ddff,#5aaae7);color:#09213a;font-size:11px;font-weight:900;padding:3px 10px;border-radius:999px;display:none}
#dialog-text{font-size:14px;line-height:1.65;white-space:pre-wrap;min-height:46px;padding-right:8px}
#dialog-next{position:absolute;right:12px;bottom:8px;font-size:10px;color:#8bd1ff;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:.25}}
#modal{position:absolute;inset:0;display:none;z-index:30;background:rgba(1,4,10,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:18px;align-items:center;justify-content:center}
#modal.show{display:flex}
.panel{width:min(94%,520px);max-height:88%;overflow:auto;background:linear-gradient(180deg,rgba(14,25,42,.97),rgba(6,12,24,.98));border:1px solid rgba(169,216,255,.26);border-radius:22px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.62),inset 0 1px rgba(255,255,255,.08)}
.panel h1,.panel h2{margin:0}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.18em;color:#79c7ff;margin-bottom:8px}.panel h1{font-size:24px;line-height:1.25}.panel .sub{font-size:12px;line-height:1.6;color:var(--muted);margin:10px 0 16px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{appearance:none;border:1px solid rgba(165,210,245,.18);background:rgba(255,255,255,.035);border-radius:16px;padding:11px 6px 9px;color:#eef7ff;font:inherit;cursor:pointer}.choice.active{border-color:#7dd3fc;background:rgba(56,189,248,.11);box-shadow:0 0 0 1px rgba(125,211,252,.18) inset}.mini-sprite{width:64px;height:64px;margin:0 auto 5px;image-rendering:pixelated}.choice b{display:block;font-size:13px}.choice span{display:block;font-size:9px;color:#98abc0;margin-top:4px}
.primary{width:100%;margin-top:14px;border:0;border-radius:14px;padding:13px 14px;background:linear-gradient(135deg,#76cfff,#3b88ca);color:#061629;font-weight:900;font-size:14px;box-shadow:0 8px 22px rgba(34,135,210,.24);cursor:pointer}.secondary{width:100%;margin-top:9px;border:1px solid rgba(160,205,240,.18);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04);color:#dcecff;font-weight:800;cursor:pointer}
.memory-card{border-radius:18px;border:1px solid rgba(173,218,255,.2);background:rgba(255,255,255,.035);padding:15px;margin-top:14px}.memory-head{display:flex;align-items:center;gap:12px}.token{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,rgba(116,197,255,.16),rgba(255,255,255,.03));border:1px solid rgba(170,220,255,.15);font-size:25px}.memory-card h3{margin:0;font-size:15px}.memory-card small{color:#8ea5bc}.memory-body{margin-top:12px;color:#d9e7f4;font-size:13px;line-height:1.7}.empty{padding:24px 12px;text-align:center;color:#8ea5bc;font-size:13px;line-height:1.7}
#controls{height:160px;flex:0 0 auto;padding:0 30px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#0b0f19,#04060a);border-top:1px solid rgba(255,255,255,.05);z-index:12}
#stick{width:120px;height:120px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
#knob{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,rgba(56,189,248,.4),rgba(2,132,199,.4));border:2px solid rgba(56,189,248,.8);box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.2);transform:translate(0,0)}
#buttons{display:flex;align-items:flex-end;gap:12px}.round{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:white;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.14);cursor:pointer;touch-action:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}.round.pressed{transform:translateY(1px) scale(.98);filter:brightness(1.08)}#bBtn{width:50px;height:50px;background:linear-gradient(135deg,rgba(239,68,68,.28),rgba(185,28,28,.35));border-color:rgba(248,113,113,.32);font-size:11px}#aBtn{width:64px;height:64px;margin-bottom:0;background:linear-gradient(135deg,rgba(34,197,94,.28),rgba(22,163,74,.35));border-color:rgba(74,222,128,.32);font-size:18px}.btnlabel{pointer-events:none;text-align:center;line-height:1.05}.btnlabel small{display:block;font-size:8px;font-weight:800;opacity:.75;margin-top:3px}
@media(min-width:768px){#controls{display:none}#app{height:min(92vh,760px);border-radius:22px;border:1px solid rgba(170,215,255,.15);box-shadow:0 25px 90px rgba(0,0,0,.65)}#dialog{bottom:24px}}
@media(max-width:480px){#controls{height:148px;padding:0 16px calc(8px + env(safe-area-inset-bottom))}#stick{width:112px;height:112px}#aBtn{width:58px;height:58px}#bBtn{width:46px;height:46px}.choices{gap:6px}.choice{padding-left:3px;padding-right:3px}}
</style>
</head>
<body>
<!-- EXPERIMENTAL / NOT CANON / 本編へ自動採用しない -->
<div id="app">
  <div id="game-wrap">
    <canvas id="game" width="280" height="400" aria-label="るみもん 旅のきおく実験"></canvas>
    <div id="hud">
      <div class="badge"><b id="placeName">スノーヴィレッジ</b><span id="buddyName">相棒：―</span></div>
      <div id="hud-actions"><button class="hudbtn" id="buddyBtn">相棒</button><button class="hudbtn" id="memoryBtn">きおく</button></div>
    </div>
    <div id="toast"></div>
    <div id="dialog"><div id="dialog-name"></div><div id="dialog-text"></div><div id="dialog-next">▼</div></div>
    <div id="modal"><div class="panel" id="modalPanel"></div></div>
  </div>
  <div id="controls">
    <div id="stick"><div id="knob"></div></div>
    <div id="buttons">
      <button class="round" id="bBtn"><span class="btnlabel">B<small>よぶ</small></span></button>
      <button class="round" id="aBtn"><span class="btnlabel">A<small>しらべる</small></span></button>
    </div>
  </div>
</div>
<script>
"use strict";
const C=document.getElementById('game'),X=C.getContext('2d');X.imageSmoothingEnabled=false;
const TS=16, MAP_W=17, MAP_H=21, GW=280, GH=400;
const ui={place:document.getElementById('placeName'),buddy:document.getElementById('buddyName'),toast:document.getElementById('toast'),dialog:document.getElementById('dialog'),dname:document.getElementById('dialog-name'),dtext:document.getElementById('dialog-text'),modal:document.getElementById('modal'),panel:document.getElementById('modalPanel')};
// TRANSPLANT: current main-game player sprite/palette from l44.html
const MAIN_PAL={'.':null,'X':'#181425','x':'#262b44','S':'#ffcd75','s':'#cb815e','H':'#ff8933','K':'#262b44','W':'#ffffff','w':'#8b9bb4','R':'#e43b44','r':'#a22633','B':'#0099db','b':'#2ce8f4','Y':'#fee761','y':'#e4a672','P':'#e2e8f0','p':'#94a3b8','V':'#8b5cf6','v':'#5b21b6','D':'#3a4466','d':'#262b44','L':'#e879f9','l':'#be185d','T':'#78350f','t':'#451a03','M':'#10b981','m':'#047857','C':'#06b6d4','c':'#0369a1','O':'#f97316','o':'#c2410c'};
const MAIN_PLAYER={
pl_d:["...rrrrrr...","..rRRRRRRr..","..rRRRRRRr..",".sSSSSSSSSs.",".sSKSSSSKSs.",".sSHSSSSHSs.","..wWWWWWWw..","..wWRRRRw..","...dDDDDd...","...d.dd.d..."],
pl_u:["...rrrrrr...","..rRRRRRRr..","..rRRRRRRr..",".rRRRRRRRRr.",".rRRRRRRRRr.",".rRRRRRRRRr.","..wWWWWWWw..","..wWRRRRw..","...dDDDDd...","...d.dd.d..."],
pl_l:["...rrrrrr...","..rRRRRRRr..","..rRRRRRRr..",".sSSSSSSSSs.",".sSKSSSSSSs.",".sSHSSSSSSs.","..wWWWWWWw..","..wWRRRRw..","...dDDDDd...","...d.dd.d..."],
pl_r:["...rrrrrr...","..rRRRRRRr..","..rRRRRRRr..",".sSSSSSSSSs.",".sSSSSSSKSs.",".sSSSSSSHSs.","..wWWWWWWw..","..wWRRRRw..","...dDDDDd...","...d.dd.d..."]
};
function drawMainPlayerSprite(ctx,key,x,y,scale=1){const data=MAIN_PLAYER[key]||MAIN_PLAYER.pl_d;for(let r=0;r<data.length;r++)for(let c=0;c<data[r].length;c++){const col=MAIN_PAL[data[r][c]];if(col){ctx.fillStyle=col;ctx.fillRect(x+c*scale,y+r*scale,scale,scale)}}}

// TRANSPLANT/TONE MATCH: same 12x10 character grammar as current main-game NPCs.
// snowkid is new, but keeps the same head/body/legs density and shared palette.
const NPC_SPRITES={
 snowkid:["...bbbbbb...","..bBBBBBBb..","..bBBBBBBb..",".sSSSSSSSSs.",".sSKSSSSKSs.",".sSHSSSSHSs.","..wWWWWWWw..","..wWCCCCWw..","...dDDDDd...","...d.dd.d..."],
 nox:["...dddddd...","..dDDDDDDd..","..dDDDDDDd..",".sSSSSSSSSs.",".sSxSSSSxSs.",".sSVVVVVVSs.","..dDDDDDDd..","..dDddddDd..","...dDDDDd...","...d.dd.d..."]
};
function drawCharSprite(ctx,data,x,y,scale=1){for(let r=0;r<data.length;r++)for(let c=0;c<data[r].length;c++){const col=MAIN_PAL[data[r][c]];if(col){ctx.fillStyle=col;ctx.fillRect(Math.round(x+c*scale),Math.round(y+r*scale),scale,scale)}}}

const BUDDIES={
 penta:{name:'ぺんた',type:'みず',note:'雪、だいすき',token:'❄',cols:['#38bdf8','#7dd3fc','#fff','#facc15'],first:'ぺんたは ためらいなく\n雪のなかへ とびこんだ！',after:'ぺんたは この場所を おぼえていた。\nこんどは 前より速く とびこんだ！',memory1:'はじめての雪。ぺんたは、止める間もなく雪の中へ飛びこんだ。',memory2:'また同じ場所へ戻ると、ぺんたは迷わず二回目へ。どうやらお気に入りになった。'},
 puwawa:{name:'ぷわわ',type:'かぜ',note:'ふわっと様子見',token:'◌',cols:['#7dd3fc','#bae6fd','#fff','#a5f3fc'],first:'ぷわわは 雪のうえで ふわり。\nそっと触れて、びっくりして はねた。',after:'ぷわわは 前の雪を おぼえていた。\n今度は くるっと回ってから 降りた。',memory1:'白い雪に、ぷわわがそっと触れた。冷たかったらしく、ふわっと跳ねた。',memory2:'戻ってくると、ぷわわは雪の上を一周してから同じ場所へ。もう驚かなかった。'},
 yamiusa:{name:'ヤミウサ',type:'やみ',note:'気になるけど慎重',token:'☾',cols:['#27234f','#4f46e5','#f3e8ff','#ef4444'],first:'ヤミウサは しばらく雪を見ている。\n……前足で 一回だけ さわった。',after:'ヤミウサは そこを避けるふりをして、\n結局 また一回だけ さわった。',memory1:'ヤミウサは雪をじっと見たあと、前足で一度だけ触った。気にはなっていたらしい。',memory2:'再び通ると避けるふりをした。でも少し戻って、また一度だけ触った。'}
};
const S={mode:'select',map:'village',buddyKey:'penta',px:4,py:13,opx:4,opy:13,face:'r',moveT:0,history:[{x:3,y:13},{x:2,y:13}],comp:{x:3,y:13,tx:3,ty:13},dialog:null,dialogName:'',msgI:0,firstDone:false,leftAfterMemory:false,revisitReady:false,revisitDone:false,notice:false,eventAnim:0,eventPhase:0,memoryOpen:false,frame:0,footprints:[],snow:[],idle:0,detour:{active:false,kind:'',timer:0,cooldown:100,target:null},npcMet:false,npcRemembered:false,restDone:false,restAnim:0,battleDone:false,battleRevisit:false,battleRevisitDone:false,battleAnim:0,threatSeen:false,threatReactTimer:0,threatComforted:false};
const maps={
 village:{name:'スノーヴィレッジ',spawn:{x:4,y:13},exit:{x:16,y:11,to:'path',tx:1,ty:11},spot:{x:11,y:9},rest:{x:4,y:10},npc:{x:6,y:9},detours:{penta:{x:8,y:11,kind:'snowman'},puwawa:{x:14,y:11,kind:'lamp'},yamiusa:{x:9,y:15,kind:'ice'}},blocked:[...rect(0,0,17,2),...rect(0,19,17,2),...rect(0,0,1,21),...rect(6,3,5,4),...rect(2,4,3,3),...rect(13,4,3,4),...rect(8,14,2,3),...rect(13,14,3,3),'6,9','4,10']},
 path:{name:'ゆきみち',spawn:{x:1,y:11},exit:{x:0,y:11,to:'village',tx:15,ty:11},battle:{x:10,y:10},threat:{x:12,y:10},blocked:[...rect(0,0,17,3),...rect(0,18,17,3),...rect(5,4,3,3),...rect(11,4,4,3),...rect(8,13,5,3),'12,10']}
};
function rect(x,y,w,h){const a=[];for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)a.push(xx+','+yy);return a}
function blocked(map,x,y){if(y<2||y>18)return true;if(x<0||x>=MAP_W)return true;return maps[map].blocked.includes(x+','+y)}
function initSnow(){S.snow=[];for(let i=0;i<120;i++)S.snow.push({x:Math.random()*GW,y:Math.random()*GH,s:.4+Math.random()*1.4,v:.25+Math.random()*.65,a:.18+Math.random()*.55,drift:(Math.random()-.5)*.25})}
initSnow();
function openSelect(first=false){S.mode='select';ui.modal.classList.add('show');const cur=S.buddyKey;ui.panel.innerHTML=`<div class="eyebrow">EXPERIMENT / NOT CANON</div><h1>旅のきおく</h1><div class="sub">相棒は寄り道し、呼べば戻る。町の人との再会、休憩、そして危険を先に感じる瞬間まで、旅の出来事を少しずつ覚えます。</div><div class="choices">${Object.entries(BUDDIES).map(([k,b])=>`<button class="choice ${k===cur?'active':''}" data-buddy="${k}"><canvas class="mini-sprite" width="64" height="64" data-mini="${k}"></canvas><b>${b.name}</b><span>${b.note}</span></button>`).join('')}</div><button class="primary" id="startBtn">${first?'この相棒で はじめる':'この相棒に かえる'}</button>${first?'':'<button class="secondary" id="cancelSel">もどる</button>'}`;
 ui.panel.querySelectorAll('[data-buddy]').forEach(btn=>btn.addEventListener('click',()=>{S.buddyKey=btn.dataset.buddy;ui.panel.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x.dataset.buddy===S.buddyKey));drawMiniAll()}));
 ui.panel.querySelector('#startBtn').addEventListener('click',()=>{resetMemory(false);ui.modal.classList.remove('show');S.mode='world';updateHud();toast(BUDDIES[S.buddyKey].name+' と あるいてみよう／Bでよぶ');});
 const c=ui.panel.querySelector('#cancelSel');if(c)c.addEventListener('click',()=>{ui.modal.classList.remove('show');S.mode='world'});drawMiniAll();
}
function drawMiniAll(){ui.panel.querySelectorAll('[data-mini]').forEach(c=>{const q=c.getContext('2d');q.clearRect(0,0,64,64);q.imageSmoothingEnabled=false;drawBuddySprite(q,c.dataset.mini,32,36,2)})}
function resetMemory(keepBuddy=true){S.map='village';S.px=4;S.py=13;S.opx=4;S.opy=13;S.face='r';S.moveT=0;S.history=[{x:3,y:13},{x:2,y:13}];S.comp={x:3,y:13,tx:3,ty:13};S.firstDone=false;S.leftAfterMemory=false;S.revisitReady=false;S.revisitDone=false;S.notice=false;S.eventAnim=0;S.eventPhase=0;S.dialog=null;S.footprints=[];S.idle=0;S.detour={active:false,kind:'',timer:0,cooldown:100,target:null};S.npcMet=false;S.npcRemembered=false;S.restDone=false;S.restAnim=0;S.battleDone=false;S.battleRevisit=false;S.battleRevisitDone=false;S.battleAnim=0;S.threatSeen=false;S.threatReactTimer=0;S.threatComforted=false;updateHud()}
function updateHud(){ui.place.textContent=maps[S.map].name;ui.buddy.textContent='相棒：'+BUDDIES[S.buddyKey].name}
function toast(t){ui.toast.textContent=t;ui.toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>ui.toast.classList.remove('show'),1700)}
function showMsg(text,name=''){S.dialog=text;S.dialogName=name;S.msgI=0;ui.dialog.classList.add('show');ui.dname.style.display=name?'block':'none';ui.dname.textContent=name;ui.dtext.textContent=''}
function advanceMsg(){if(!S.dialog)return;if(S.msgI<S.dialog.length){S.msgI=S.dialog.length;ui.dtext.textContent=S.dialog;return}S.dialog=null;ui.dialog.classList.remove('show')}

function drawLamp(x,y){X.fillStyle='#526475';X.fillRect(x*TS+7,y*TS+2,3,19);X.fillStyle='#ffde82';X.fillRect(x*TS+3,y*TS,11,8);X.fillStyle='rgba(255,214,120,.15)';X.beginPath();X.arc(x*TS+8,y*TS+5,20,0,Math.PI*2);X.fill()}
function drawSnowman(x,y,s){X.save();X.translate(x*TS,y*TS);X.scale(s,s);X.fillStyle='rgba(20,40,70,.22)';X.beginPath();X.ellipse(0,10,16,5,0,0,Math.PI*2);X.fill();X.fillStyle='#f8fdff';X.beginPath();X.arc(0,0,12,0,Math.PI*2);X.fill();X.beginPath();X.arc(0,-17,9,0,Math.PI*2);X.fill();X.fillStyle='#243448';X.fillRect(-4,-20,2,2);X.fillRect(3,-20,2,2);X.fillStyle='#f49b43';X.fillRect(0,-17,8,2);X.fillStyle='#7f4b73';X.fillRect(-9,-10,18,3);X.restore()}
function drawSnowdrift(x,y){const px=x*TS+8,py=y*TS+12;X.fillStyle='rgba(102,140,174,.18)';X.beginPath();X.ellipse(px,py+5,22,7,0,0,Math.PI*2);X.fill();X.fillStyle='#f8fdff';X.beginPath();X.ellipse(px,py,18,8,0,0,Math.PI*2);X.fill();X.fillStyle='#d7e9f5';X.beginPath();X.ellipse(px-4,py+2,11,4,0,0,Math.PI*2);X.fill();}
function drawFootprints(){X.fillStyle='rgba(74,108,137,.22)';for(const f of S.footprints){if(f.map!==S.map)continue;const a=Math.max(0,Math.min(.25,f.life/250*.25));X.globalAlpha=a/.25;X.fillRect(f.x*TS+5,f.y*TS+10,3,5);X.fillRect(f.x*TS+10,f.y*TS+8,3,5);X.globalAlpha=1}}
function interpPos(){const t=S.moveT/8;return{x:S.px+(S.opx-S.px)*t,y:S.py+(S.opy-S.py)*t}}
function drawPlayer(){const p=interpPos(),x=Math.round(p.x*TS+8),y=Math.round(p.y*TS+11);X.fillStyle='rgba(10,20,40,.22)';X.beginPath();X.ellipse(x,y+2,6,2,0,0,Math.PI*2);X.fill();drawMainPlayerSprite(X,'pl_'+S.face,x-6,y-10,1)}
function drawCompanion(){let x=S.comp.x*TS+8,y=S.comp.y*TS+11;if(S.eventAnim>0){const t=1-S.eventAnim/90;const bounce=Math.sin(t*Math.PI*3)*Math.max(0,1-t)*5;if(S.buddyKey==='penta')y+=bounce;else if(S.buddyKey==='puwawa')y-=5+Math.sin(t*Math.PI*4)*3;else x+=Math.sin(t*Math.PI*2)*2}if(S.restAnim>0){if(S.buddyKey==='puwawa')y-=4+Math.sin(S.frame*.12)*2;else y+=2}if(S.threatReactTimer>0&&!S.battleDone){if(S.buddyKey==='penta'){x+=Math.sin(S.frame*.9)*1.4}else if(S.buddyKey==='puwawa'){x+=Math.sin(S.frame*.42)*1.2;y+=Math.sin(S.frame*.55)*1.5}else{x+=Math.sin(S.frame*.72)*.9}}if(S.battleAnim>0){x+=Math.sin(S.frame*.45)*2;y+=Math.sin(S.frame*.22)}drawBuddySprite(X,S.buddyKey,x,y,1)}
function drawBuddySprite(ctx,key,x,y,sc=1){
 // TRANSPLANT: exact pixel motifs from the current LUMINARIA MONSTER LIST.
 ctx.save();ctx.translate(Math.round(x),Math.round(y));
 const m=12;
 const d=(gx,gy,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round((gx-m)*sc),Math.round((gy-m-4)*sc),sc,sc)};
 const ci=(cx,cy,r,c)=>{for(let yy=-r;yy<=r;yy++)for(let xx=-r;xx<=r;xx++)if(xx*xx+yy*yy<=r*r)d(cx+xx,cy+yy,c)};
 const eye=(gx,gy,c='#0f172a')=>d(gx,gy,c),ck=(gx,gy)=>d(gx,gy,'#f472b6');
 ctx.fillStyle='rgba(10,20,40,.20)';ctx.beginPath();ctx.ellipse(0,Math.round(2*sc),Math.round(6*sc),Math.max(1,Math.round(2*sc)),0,0,Math.PI*2);ctx.fill();
 if(key==='puwawa'){
   ci(m,m,5,'#7dd3fc');ci(m,m-1,4,'#bae6fd');
   d(m+2,m+2,'#ffffff');d(m+3,m+3,'#ffffff');
   d(m-5,m,'#ffffff');d(m-6,m-1,'#ffffff');d(m+5,m,'#ffffff');d(m+6,m-1,'#ffffff');
   eye(m-2,m);eye(m+2,m);
 }else if(key==='penta'){
   ci(m,m+1,5,'#38bdf8');ci(m,m,4,'#7dd3fc');ci(m,m+2,3,'#ffffff');
   d(m-5,m+1,'#38bdf8');d(m+5,m+1,'#38bdf8');eye(m-2,m);eye(m+2,m);d(m,m+1,'#facc15');
   d(m-2,m+5,'#facc15');d(m+2,m+5,'#facc15');
 }else{
   ci(m,m+1,5,'#312e81');ci(m,m,4,'#4f46e5');
   d(m-2,m-5,'#312e81');d(m-2,m-6,'#312e81');d(m-2,m-7,'#1e1b4b');
   d(m-1,m-5,'#4f46e5');d(m-1,m-6,'#4f46e5');d(m-1,m-7,'#312e81');
   d(m+1,m-5,'#4f46e5');d(m+1,m-6,'#4f46e5');d(m+1,m-7,'#312e81');
   d(m+2,m-5,'#312e81');d(m+2,m-6,'#312e81');d(m+2,m-7,'#1e1b4b');
   eye(m-2,m);eye(m+2,m);ck(m-3,m+1);ck(m+3,m+1);
 }
 ctx.restore();
}
function drawNotice(){const sp=maps.village.spot;let x=S.comp.x*TS+8,y=S.comp.y*TS-4;X.save();X.font='bold 12px sans-serif';X.textAlign='center';X.fillStyle='rgba(7,15,27,.85)';roundRect(X,x-14,y-19,28,16,7);X.fill();X.fillStyle='#ffe38a';X.fillText('!',x,y-7);X.restore();if(dist(S.px,S.py,sp.x,sp.y)<=2){X.save();X.font='bold 9px sans-serif';X.textAlign='center';X.fillStyle='rgba(5,13,25,.72)';roundRect(X,GW/2-46,GH-52,92,22,11);X.fill();X.fillStyle='#dff3ff';X.fillText('A で しらべる',GW/2,GH-38);X.restore()}}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawSnow(){X.save();for(const p of S.snow){X.globalAlpha=p.a;X.fillStyle='#fff';X.fillRect(p.x,p.y,p.s,p.s)}X.globalAlpha=1;X.restore()}
let keys={};document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();if(e.key==='Enter'||e.key==='z'||e.key===' ')tryAction();if(e.key==='x')callBuddy();if(e.key==='m'&&S.mode==='world')openMemory();if(e.key==='Escape'){if(S.dialog)advanceMsg();else if(S.mode==='memory')closeModal()}});document.addEventListener('keyup',e=>keys[e.key]=false);
setInterval(()=>{if(S.mode!=='world'||S.dialog||S.eventAnim>0)return;if(keys.ArrowUp||keys.w)tryMove('u');else if(keys.ArrowDown||keys.s)tryMove('d');else if(keys.ArrowLeft||keys.a)tryMove('l');else if(keys.ArrowRight||keys.d)tryMove('r')},85);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let joy=false,joyDir=null,joyTimer=null;function joyUpdate(cx,cy){const r=stick.getBoundingClientRect(),dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2),d=Math.hypot(dx,dy),max=32,k=d>max?max/d:1;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;joyDir=d<11?null:(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))}
function joyStart(e){e.preventDefault();joy=true;const t=e.touches?e.touches[0]:e;joyUpdate(t.clientX,t.clientY);clearInterval(joyTimer);joyTimer=setInterval(()=>{if(joy&&joyDir)tryMove(joyDir)},88);if(joyDir)tryMove(joyDir)}function joyMove(e){if(!joy)return;e.preventDefault();const t=e.touches?e.touches[0]:e;joyUpdate(t.clientX,t.clientY)}function joyEnd(e){if(e)e.preventDefault();joy=false;joyDir=null;knob.style.transform='translate(0,0)';clearInterval(joyTimer)}
stick.addEventListener('touchstart',joyStart,{passive:false});stick.addEventListener('touchmove',joyMove,{passive:false});stick.addEventListener('touchend',joyEnd,{passive:false});stick.addEventListener('touchcancel',joyEnd,{passive:false});stick.addEventListener('mousedown',joyStart);window.addEventListener('mousemove',joyMove);window.addEventListener('mouseup',joyEnd);
function bindRound(id,fn){const b=document.getElementById(id);const down=e=>{e.preventDefault();b.classList.add('pressed');fn()};const up=e=>{e.preventDefault();b.classList.remove('pressed')};b.addEventListener('touchstart',down,{passive:false});b.addEventListener('touchend',up,{passive:false});b.addEventListener('touchcancel',up,{passive:false});b.addEventListener('mousedown',down);b.addEventListener('mouseup',up);b.addEventListener('mouseleave',up)}bindRound('aBtn',tryAction);bindRound('bBtn',()=>{if(S.dialog)advanceMsg();else if(S.mode==='memory')closeModal();else callBuddy()});
function resize(){const wrap=document.getElementById('game-wrap'),w=wrap.clientWidth,h=wrap.clientHeight,sc=Math.min(w/GW,h/GH);C.style.width=Math.floor(GW*sc)+'px';C.style.height=Math.floor(GH*sc)+'px'}window.addEventListener('resize',resize);resize();updateHud();openSelect(true);requestAnimationFrame(loop);
</script>
