function npcDirectionalSpriteData(n){

  const eyeX=dir===1?8:3;
  for(let r=3;r<=5&&r<rows.length;r++) rows[r]=rows[r].replace(/[KH]/g,"S");

  return rows;
}

function calcCapture(mon,ballKind){
  const h=cl(mon.hp/mon.mhp,0,1);
  const base=cl((MON[mon.mid]?.catch??MON[mon.mid]?.cr??100),35,255);
  const hpMul=1.0+(1.0-h)*1.5;
  const statusMul=CAP_STATUS_MUL[mon.sts]??1.0;
  const ballMul=CAP_BALL_MUL[ballKind]??1.0;
  const p=cl((base/255)*hpMul*statusMul*ballMul,0.02,0.95);
  const r=cl(Math.floor(p*4),0,3);
  const shakes=cl(Math.min(3,Math.max(1,r)),1,3);
  return {p,shakes,h,statusMul,ballMul,base};
}

function sioRoomKind(mid){return SIO_ROOM_KIND[mid]||null;}
function sgmCreateRoom(type){
  const w=13,h=13,t=new Array(w*h).fill(101);
  for(let y=3;y<h-1;y++)for(let x=1;x<w-1;x++)t[y*w+x]=100;
  t[(h-2)*w+6]=103;
  if(type==="center"){
    for(let x=4;x<=8;x++)t[5*w+x]=102;
    t[4*w+6]=105;t[8*w+2]=106;t[8*w+10]=106;
  }else if(type==="shop"){
    for(let x=2;x<=4;x++)t[5*w+x]=102;
    for(let x=8;x<=10;x++)t[5*w+x]=102;
    for(let x=2;x<=10;x++)if(x!==6)t[8*w+x]=104;
  }else if(type==="cafe"){
    for(let x=5;x<=7;x++)t[4*w+x]=105;
    t[7*w+3]=102;t[7*w+9]=102;t[9*w+3]=102;t[9*w+9]=102;
  }else if(type==="gym"){
    for(let y=3;y<h-1;y++)for(let x=1;x<w-1;x++)t[y*w+x]=108;
    for(let y=5;y<h-1;y++)t[y*w+6]=100;
    for(let y=4;y<=6;y++)for(let x=4;x<=8;x++)t[y*w+x]=100;
    t[3*w+6]=102;t[4*w+4]=105;t[4*w+8]=105;
  }else{
    t[4*w+2]=102;t[4*w+3]=102;t[6*w+6]=107;t[4*w+10]=104;t[8*w+2]=106;
  }
  return t;
}
function sgmRoom(nm,type,npcs,extra={}){
  return {nm,w:13,h:13,enc:[],t:sgmCreateRoom(type),npcs,...extra};
}

function gT(mid,x,y){const m=MAPS[mid];if(!m||x<0||y<0||x>=m.w||y>=m.h)return 2;return m.t[y*m.w+x];}
function canW(mid,x,y){
  const t=gT(mid,x,y);
  if(mid==='start') return [0,43,46,18].includes(t);
  if(sioRoomKind(mid)) return t===100||t===103;
  const inRect=(x0,y0,w,h)=>x>=x0&&x<x0+w&&y>=y0&&y<y0+h;
  if(mid==='t3'||mid==='snowPath'){
    const base=[0,1,5,6,7,18,19,31,33,34,35,20,21,22].includes(t);
    if(!base)return false;
    if(mid==='t3'){
      if(inRect(4,4,7,4)&&!(x===7&&y===8))return false;
      if(inRect(28,4,7,4)&&!(x===31&&y===8))return false;
      if(inRect(16,22,8,4)&&!(x===20&&y===26))return false;
      if(inRect(28,22,7,4)&&!(x===31&&y===26))return false;
      if(inRect(4,16,3,3)&&!(x===5&&y===19))return false;
      if(inRect(30,14,3,3)&&!(x===31&&y===17))return false;
      if(inRect(17,11,4,3))return false;
      if(inRect(9,10,3,2))return false;
      if(inRect(11,18,3,3))return false;
      if(inRect(4,24,6,3))return false;
      if(inRect(32,10,4,3))return false;
      if(inRect(15,22,2,1))return false;
    }
    if(mid==='snowPath'&&x>=16&&y<=8){
      if((x===18||x===19)&&y===8)return true;
      return false;
    }
    return true;
  }
  const base=t===0||t===1||t===5||t===6||t===7||t===18||t===19||t===31||t===34||t===35;
  if(!base)return false;
  if(mid==='t2'){
    if(y===1&&x>=6&&x<=8)return true;
    return [0,11,20,21].includes(sgmGetT(x,y));
  }
  if(mid==='r3'&&inRect(13,1,7,4))return false;
  return true;
}

function tryPortalAt(fx,fy,mode="interact"){
  const list=WORLD_PORTALS[G.map]||[];
  for(const p of list){
    const onDoor = p.fx===fx && p.fy===fy;
    const atFront = p.front && p.front.x===G.px && p.front.y===G.py && p.fx===fx && p.fy===fy;
    if((mode==="step" && onDoor) || (mode!=="step" && (onDoor || atFront))){
      moveToMap(p.to,p.tx,p.ty,"portal");
      sfx('sel');
      return true;
    }
  }
  return false;
}

let premiumParticles = [], premiumFootprints = [], premiumBreaths = [], premiumWorldParticles = [], premiumIdleTime = 0, ambientBGMInterval = null;

function updatePremiumEffects() {
  if (G.st !== 'WORLD') {
    premiumBreaths.length = 0;
    return;
  }
  const isOut = (G.map === 't3' || G.map === 'snowPath' || G.map === 'r3');

  if (isOut && premiumParticles.length < 260) {
    premiumParticles.push({
      x: Math.random() * GW,
      y: -10,
      vx: (Math.random() - 0.5) * 0.8 - (G.map === 'snowPath' ? 0.45 : 0.18),
      vy: Math.random() * 0.7 + 0.45,
      s: Math.random() * 1.5 + 0.45,
      a: Math.random() * 0.55 + 0.18,
      type: 'snow'
    });
  }

  for (let i = premiumParticles.length - 1; i >= 0; i--) {
    const p = premiumParticles[i];
    if (p.type === 'snow') {
      p.x += p.vx; p.y += p.vy;
      if (G.map === 'snowPath') p.vx -= 0.006;
      if (p.y > GH || p.x < -20 || p.x > GW + 20 || !isOut) premiumParticles.splice(i, 1);
    }
  }

  if (G.map === 't3' && Math.random() < 0.08) {
    premiumWorldParticles.push({ tx: 20, ty: 22, xOffset: Math.random()*10-5, vx: (Math.random()-0.5)*0.15 + 0.08, vy: -Math.random()*0.35 - 0.15, s: Math.random()*2.5+1.5, a: 0.35, life: 0, type: 'smoke' });
  }
  for (const tx of [7, 31]) {
    if (G.map === 't3' && Math.random() < 0.03) {
      premiumWorldParticles.push({ tx, ty: tx === 7 ? 10 : 9, xOffset: Math.random()*8-4, vx: (Math.random()-0.5)*0.15 + 0.08, vy: -Math.random()*0.3 - 0.15, s: Math.random()*2+1, a: 0.28, life: 0, type: 'smoke' });
    }
  }
  for (let i = premiumWorldParticles.length - 1; i >= 0; i--) {
    const p = premiumWorldParticles[i];
    p.xOffset += p.vx; p.ty += p.vy / TS; p.s += 0.08; p.a -= 0.0025;
    if (p.a <= 0) premiumWorldParticles.splice(i, 1);
  }

  for (let i = premiumFootprints.length - 1; i >= 0; i--) {
    premiumFootprints[i].life--;
    if (premiumFootprints[i].life <= 0) premiumFootprints.splice(i, 1);
  }
  if (mvT === 0 && !U.msg && isOut) {
    premiumIdleTime++;
    if (premiumIdleTime > 140 && premiumIdleTime % 110 === 0) premiumBreaths.push({ x: G.px * TS + 8, y: G.py * TS + 1, life: 84, vy: -0.15, s: 2 });
  } else premiumIdleTime = 0;
  for (let i = premiumBreaths.length - 1; i >= 0; i--) {
    const b = premiumBreaths[i]; b.life--; b.y += b.vy; b.s += 0.07;
    if (b.life <= 0) premiumBreaths.splice(i, 1);
  }
}

function clearPremiumEffects() {
  premiumParticles = [];
  premiumWorldParticles = [];
  premiumBreaths = [];

function npcTalk(n){
  if(n.nm==="ミキおばさん"){
    if(G.tb["nxi"] && !G.fl.nox) return "……ねえ。\nみなみの どうろで\nへんな ひとたちを みたの。\nきをつけてね…";
    if(G.fl.nox) return "よかった…。\nへんな ひとたち みかけなくなったわ。\nほんとに ありがとうね。";
    if(G.pty.length===0) return "きょうの むらは なんだか\nそわそわしてるの。\nはかせが きみを さがしてたわよ";
    if(!G.fl.rv1) return "あら その子が パートナー？\nさっきより むらの かぜまで\nちがって みえるわね";
    return "まあ もう そんな かおをするのね。\nその子も あなたの うしろを\nちゃんと ついてきてるみたい";
  }
  if(n.nm==="ゲンじいさん"){
    if(G.pty.length===0) return "わしも むかしは トレーナーでのう…\n最初の相棒は コノハじゃった\nいまでも わすれとらん";
    if(!G.fl.rv1) return "どうじゃ その子。 ええじゃろう\nわしの 最初の相棒も コノハでのう\nさいしょの 1ぴきは べつものじゃ";
    return "どうじゃ もう その子を\nまもる かおに なっとる。\nたびは そこからが おもしろい";
  }
  if(n.nm==="ショウ"){
    if(G.pty.length===0) return "はかせの ところ いくの？\nきょうは むらの くうきも\nいつもと ちがうんだ";
    if(!G.fl.rv1) return "もう パートナーを えらんだんだな。\nさっきまでの むらと\nほんとに いろが ちがって みえるよ";
    return "もう しょうぶして きたのか。\nむらの みえかたまで\nかわるもんなんだなあ";
  }
  if(n.nm==="ナナ"){
    if(G.pty.length===0) return "けんきゅうじょの まえって\nなんだか どきどき するよね。\nきょうは いつもと ちがう かんじ！";
    if(!G.fl.rv1) return "その子が パートナーなんだ！\nさっきまでの むらと ちがって\nみえるの ふしぎだよね";
    return "もう しょうぶして きたの？\nなんか ほんとに たびびとって かお！";
  }
  if(n.nm==="シオリ"){
    if(G.pty.length===0) return "ゲンじいさんの はなし\nなんだか すきなんだ。\nさいしょの 1ぴきって とくべつだよね";
    if(!G.fl.rv1) return "その子が きみの\nさいしょの 1ぴきなんだね。\nあとで ずっと おぼえてそう";
    return "ゲンじいさん うれしそうだったよ\nさいしょの 1ぴきって\nたびの かおになるんだって";
  }
  if(n.nm==="助手 ミナ"){
    if(G.pty.length===0) return "ゲンじいさん さっきも\n『最初の相棒は コノハじゃった』って\nうれしそうに はなしてたよ";
    if(!G.fl.rv1) return "さいしょの 1ぴきって\nえらんだ あとで もっと すきに なるの。\nふしぎ だよね";
    return "きょうの けんきゅうじょ\nさっきより ずっと にぎやかに みえるなあ";
  }
  if(n.nm==="ツバキはかせ"){
    if(G.pty.length===0) return "おお きたか。\nけっしょうに ひびく 1ぴきを\nちゃんと えらぶんじゃぞ";
    if(!G.fl.rv1) return "その子と ならんで あるいてみい。\nむらを でるまえから\nもう きずなは はじまっとる";
    if(!G.fl.g1) return "ほう… もう はじめての バトルを\nこえてきた かおじゃな。\nつぎは まちで じゅんびを してみるといい";
    if(dexCount()>=5 && !G.fl.labDex5) return "ずかんが ふえてきたのう。\nつかまえる たびに たびの みえかたも\nかわっていくもんじゃ";
    return "けっしょうと ルミモンの きずな…\nまだまだ しらないこと だらけじゃ";
  }
  if(n.nm==="ソラ" || n.nm==="ライバル ソラ"){
    if(G.fl.soraFall && !G.fl.soraBack) return "……いまは はなせない。\nごめん。";
    if(G.pty.length===0) return "はやく えらぼうよ！\nどの子も つよそうで\nまようよなあ…";
    if(!G.fl.rv1) return "その子に きめたんだ！\nぼくも もう まけないからね。\n1ばんどうろで まってる！";
    return "つぎに あう ときまでに\nもっと つよく なっておくから！";
  }
  return n.msg;
