"use strict";

const C = document.getElementById("gc"), X = C.getContext("2d");
let GW = 280, GH = 400, SC = 1, TK = 0; 

function resize() {
    const a = document.getElementById("ga");
    const w = a.clientWidth, h = a.clientHeight;
    SC = Math.min(w / GW, h / GH);
    C.width = GW; C.height = GH;
    C.style.width = (GW * SC) + "px"; C.style.height = (GH * SC) + "px";
}
resize(); window.addEventListener("resize", resize);

// --- Audio System ---
let actx = null, bgmInterval = null;
function initAudio() {
    try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
    } catch(e) {}
}

function playStep() {
    if (!actx) return;
    const t = actx.currentTime;
    const gain = actx.createGain();
    gain.connect(actx.destination);

    if (G.map === 't3' || G.map === 'snowPath') {
        const bufferSize = actx.sampleRate * 0.1;
        const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = actx.createBufferSource(); noise.buffer = buffer;
        const filter = actx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 800 + Math.random() * 400;
        gain.gain.setValueAtTime(0.18, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        noise.connect(filter); filter.connect(gain); noise.start(t);
    } else if (G.map.startsWith('cave')) {
        const osc = actx.createOscillator(); osc.type = 'triangle';
        osc.frequency.setValueAtTime(90, t); osc.frequency.exponentialRampToValueAtTime(30, t + 0.2);
        gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.connect(gain); osc.start(t); osc.stop(t + 0.3);
    } else {
        const osc = actx.createOscillator(); osc.type = 'sine';
        osc.frequency.setValueAtTime(140, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.05);
        gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        osc.connect(gain); osc.start(t); osc.stop(t + 0.05);
    }
}

function playSfx(type) {
    if (!actx) return;
    const t = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.connect(gain); gain.connect(actx.destination);

    if (type === 'sel') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, t); osc.frequency.exponentialRampToValueAtTime(1760, t + 0.05);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'door') {
        osc.type = 'square'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.start(t); osc.stop(t + 0.15);
    } else if (type === 'cancel') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, t); osc.frequency.exponentialRampToValueAtTime(110, t + 0.12);
        gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.start(t); osc.stop(t + 0.12);
    }
}

function startAmbientBGM() {
    if (!actx || bgmInterval) return;
    const notes = [261.63, 329.63, 392.00, 523.25, 587.33, 783.99]; 
    bgmInterval = setInterval(() => {
        if(Math.random() > 0.55) return;
        const isOut = (G.map === 't3' || G.map === 'snowPath');
        const isCave = G.map.startsWith('cave');
        const t = actx.currentTime;
        const osc = actx.createOscillator(); const gain = actx.createGain(); const filter = actx.createBiquadFilter();

        osc.type = isCave ? 'sine' : (isOut ? 'sine' : 'triangle');
        osc.frequency.value = notes[Math.floor(Math.random() * notes.length)] * (isCave ? 0.25 : (isOut ? 0.5 : 1));
        filter.type = 'lowpass'; filter.frequency.value = isCave ? 400 : (isOut ? 800 : 1200);

        gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(isCave ? 0.08 : (isOut ? 0.05 : 0.03), t + 2.0); 
        gain.gain.exponentialRampToValueAtTime(0.001, t + (isCave ? 8.0 : 6.0)); 

        osc.connect(filter); filter.connect(gain); gain.connect(actx.destination);
        osc.start(t); osc.stop(t + (isCave ? 8.0 : 6.0));
    }, 2000);
}

// --- Engine State ---
const TS = 16;

let jx = 0, jy = 0, jAct = false, tapA = false, tapB = false, keys = {};
const JC = document.getElementById("jc"), JX = JC.getContext("2d");

function jUpd(cx, cy) {
    const dx = cx - 58, dy = cy - 58, dist = Math.sqrt(dx*dx + dy*dy);
    if(dist > 32) { jx = dx/dist*32; jy = dy/dist*32; }
    else { jx = dx; jy = dy; }
}
const jEv = (e) => { e.preventDefault(); jAct=true; initAudio(); const r=JC.getBoundingClientRect(); jUpd(e.touches[0].clientX-r.left, e.touches[0].clientY-r.top); };
JC.addEventListener("touchstart", jEv, {passive:false});
JC.addEventListener("touchmove", jEv, {passive:false});
["touchend","touchcancel"].forEach(ev => JC.addEventListener(ev, e => { e.preventDefault(); jAct=false; jx=0; jy=0; }, {passive:false}));

document.addEventListener("keydown", e => { keys[e.key] = true; initAudio(); });
document.addEventListener("keyup", e => { keys[e.key] = false; });

const btnA = document.getElementById("ba"), btnB = document.getElementById("bb");
const bindBtn = (btn, key) => {
    btn.addEventListener("touchstart", e => { e.preventDefault(); initAudio(); if(key==='a') tapA=true; else tapB=true; }, {passive:false});
    btn.addEventListener("mousedown", e => { e.preventDefault(); initAudio(); if(key==='a') tapA=true; else tapB=true; });
};

function dJoy() {
    JX.clearRect(0,0,116,116);
    JX.fillStyle = "rgba(40, 50, 70, 0.4)";
    JX.beginPath(); JX.arc(58,58,48,0,Math.PI*2); JX.fill();

    JX.beginPath(); JX.arc(58+jx, 58+jy, 22, 0, Math.PI*2); JX.fill();
    JX.strokeStyle = jAct ? "rgba(255,255,255,0.6)" : "rgba(255,255,255,0.2)";
    JX.lineWidth = 1.5; JX.stroke();
}

function getInputs() {
    let dir = null, a = tapA || keys.Enter || keys[" "] || keys.z, b = tapB || keys.Escape || keys.x;
    tapA = false; tapB = false;
    if (Math.abs(jx)>12 || Math.abs(jy)>12) {
        dir = Math.abs(jx) > Math.abs(jy) ? (jx>0?"r":"l") : (jy>0?"d":"u");
    }
    if (keys.ArrowUp || keys.w) dir = "u";
    if (keys.ArrowDown || keys.s) dir = "d";
    if (keys.ArrowLeft || keys.a) dir = "l";
    if (keys.ArrowRight || keys.d) dir = "r";
    return { dir, a, b };
}

function gT(mid, x, y) {
    const m = MAPS[mid];
    if(!m || x<0 || y<0 || x>=m.w || y>=m.h) return 2;
    return m.t[y*m.w + x];
}

function canW(mid, x, y) {
    const t = gT(mid, x, y);
    const base = [0,1,5,6,7,18,19,31,33,34,35,20,21,22].includes(t); 
    if (!base) return false;
    const inRect = (x0,y0,w,h) => x>=x0 && x<x0+w && y>=y0 && y<y0+h;
    if(mid === 't3') {
        if(inRect(4,4,7,4) && !(x===7&&y===8)) return false;
        if(inRect(28,4,7,4) && !(x===31&&y===8)) return false;
        if(inRect(16,22,8,4) && !(x===20&&y===26)) return false;
        if(inRect(28,22,7,4) && !(x===31&&y===26)) return false;
        if(inRect(4,16,3,3) && !(x===5&&y===19)) return false;
        if(inRect(30,14,3,3) && !(x===31&&y===17)) return false;
        if(inRect(17,11,4,3)) return false;
        if(inRect(9,10,3,2)) return false;
        if(inRect(11,18,3,3)) return false;
        if(inRect(4,24,6,3)) return false;
        if(inRect(32,10,4,3)) return false;
        if(inRect(15,22,2,1)) return false;
    }
    if(mid === 'snowPath') {
        if (x >= 16 && y <= 8) {
            if (x===18 && y===8) return true; 
            if (x===19 && y===8) return true;
            return false;
        }
    }
    return true;
}

let particles = [], footprints = [], breaths = [], worldParticles = [], idleTime = 0;

function updateEffects() {
    const isOut = (G.map === 't3' || G.map === 'snowPath');
    const isCave = G.map.startsWith('cave');

    if (isOut && particles.length < 350) {
        particles.push({
            x: Math.random() * GW, y: -10,
            vx: (Math.random() - 0.5) * 0.8 - (G.map==='snowPath'?0.5:0.2),
            vy: Math.random() * 0.7 + 0.5,
            s: Math.random() * 1.5 + 0.5,
            a: Math.random() * 0.6 + 0.2, type: 'snow'
        });
    } else if (isCave && particles.length < 80) {
        particles.push({
            x: Math.random() * GW, y: GH + 10,
            vx: (Math.random() - 0.5) * 0.4, vy: -Math.random() * 0.5 - 0.2,
            s: Math.random() * 2 + 1, a: 0.1, life: 0, type: 'sparkle'
        });
    }

    for(let i = particles.length-1; i>=0; i--) {
        let p = particles[i];
        if (p.type === 'snow') {
            p.x += p.vx; p.y += p.vy;
            if (G.map === 'snowPath') p.vx -= 0.006; 
            if (p.y > GH || p.x < -20 || p.x > GW + 20 || !isOut) particles.splice(i, 1);
        } else if (p.type === 'sparkle') {
            p.x += p.vx; p.y += p.vy; p.life += 0.02; p.a = Math.sin(p.life) * 0.7;
            if (p.life > Math.PI || !isCave) particles.splice(i, 1);
        }
    }

    if (G.map === 't3' && Math.random() < 0.15) {
        worldParticles.push({
            tx: 22, ty: 20,
            xOffset: Math.random()*8-4,
            vx: (Math.random() - 0.5) * 0.2 + 0.1, vy: -Math.random() * 0.5 - 0.3,
            s: Math.random() * 3 + 2, a: 0.5, life: 0, type: 'smoke'
        });
    }
    for(let tx of [3, 35]) {
        if (G.map === 't3' && Math.random() < 0.05) {
            worldParticles.push({
                tx: tx===3?6:32, ty: tx===3?14:12,
                xOffset: Math.random()*6-3,
                vx: (Math.random() - 0.5) * 0.2 + 0.1, vy: -Math.random() * 0.4 - 0.2,
                s: Math.random() * 2 + 1, a: 0.4, life: 0, type: 'smoke'
            });
        }
    }
    for(let i = worldParticles.length-1; i>=0; i--) {
        let p = worldParticles[i];
        p.xOffset += p.vx; p.ty += p.vy / TS; p.s += 0.1; p.a -= 0.003;
        if (p.a <= 0) worldParticles.splice(i, 1);
    }

    for(let i = footprints.length-1; i>=0; i--) {
        footprints[i].life--;
        if(footprints[i].life <= 0) footprints.splice(i, 1);
    }
    if (mvT === 0 && !U.msg && isOut) {
        idleTime++;
        if (idleTime > 120 && idleTime % 100 === 0) breaths.push({ x: G.px * TS + 8, y: G.py * TS + 2, life: 80, vy: -0.15, s: 2 });
    } else idleTime = 0;
    for(let i = breaths.length-1; i>=0; i--) {
        let b = breaths[i]; b.life--; b.y += b.vy; b.s += 0.07;
        if(b.life <= 0) breaths.splice(i, 1);
    }
}

function dTile(dx, dy, t, txx, ty2) {
    const iFloor='#201c25', iWall='#302838', iWallB='#15101a';

    if(t===8 || t===34 || t===35) {
        X.fillStyle = t===8 ? '#dfeef8' : (t===34 ? '#e7f4ff' : '#dcecf8');
        X.fillRect(dx, dy, TS, TS);
        X.fillStyle = 'rgba(255,255,255,0.5)';
        if((txx*7+ty2)%3 === 0) X.fillRect(dx+3, dy+3, 2, 1);
        if((txx+ty2*3)%5 === 0) X.fillRect(dx+10, dy+10, 2, 1);
        return;
    }
    if(t===2) {
        X.fillStyle = iWall; X.fillRect(dx, dy, TS, TS);
        X.fillStyle = iWallB; X.fillRect(dx, dy+TS-4, TS, 4);
        return;
    }
    if(t===20 || t===21 || t===22) {
        X.fillStyle = t===22 ? '#e8f0f8' : iFloor;
        X.fillRect(dx, dy, TS, TS);
        if(t===21) { X.fillStyle='#4a3022'; X.fillRect(dx+2, dy+4, 12, 8); }
        return;
    }
    if(t===31) { X.fillStyle='#131a28'; X.fillRect(dx,dy,TS,TS); return; } 
    if(t===32) { X.fillStyle='#090d14'; X.fillRect(dx,dy,TS,TS); X.fillStyle='#131a28'; X.fillRect(dx, dy+TS-4, TS, 4); return; } 
    if(t===33) { 
        X.fillStyle='#131a28'; X.fillRect(dx,dy,TS,TS); 
        X.fillStyle='#5eead4'; 
        X.beginPath();X.moveTo(dx+8,dy+2);X.lineTo(dx+12,dy+7);X.lineTo(dx+9,dy+13);X.lineTo(dx+5,dy+13);X.lineTo(dx+3,dy+7);X.fill(); 
        X.fillStyle='rgba(255,255,255,0.7)'; X.fillRect(dx+7, dy+4, 2, 5);
        return; 
    }
    X.fillStyle = '#111'; X.fillRect(dx, dy, TS, TS);
}

function drawLighting(cx, cy) {
    X.save();
    const isOut = (G.map === 't3' || G.map === 'snowPath');
    const isCave = G.map.startsWith('cave');

    if (isOut) {
        X.fillStyle = G.map === 'snowPath' ? "rgba(4, 6, 14, 0.85)" : "rgba(6, 10, 22, 0.75)";
        X.globalCompositeOperation = "source-over";
        X.fillRect(0, 0, GW, GH);
        X.globalCompositeOperation = "screen";

        const ptx = (G.opx + (G.px - G.opx) * (1 - mvT / 160)) * TS - cx + 8;
        const pty = (G.opy + (G.py - G.opy) * (1 - mvT / 160)) * TS - cy + 8;
        let pGrd = X.createRadialGradient(ptx, pty, 0, ptx, pty, 80);
        pGrd.addColorStop(0, "rgba(40, 60, 100, 0.7)");
        pGrd.addColorStop(1, "rgba(0, 0, 0, 0)");
        X.fillStyle = pGrd;
        X.beginPath(); X.arc(ptx, pty, 80, 0, Math.PI*2); X.fill();

        const lights = [];
        if (G.map === 't3') {
            lights.push({tx: 7, ty: 10, r: 100, c: "rgba(255, 100, 80, 0.6)"}); 
            lights.push({tx: 31, ty: 9, r: 100, c: "rgba(255, 160, 80, 0.6)"}); 
            lights.push({tx: 20, ty: 27, r: 150, c: "rgba(255, 150, 60, 0.65)"}); 
            lights.push({tx: 31, ty: 27, r: 90, c: "rgba(160, 210, 255, 0.5)"}); 
            lights.push({tx: 5, ty: 20, r: 80, c: "rgba(255, 180, 100, 0.5)"}); 
            lights.push({tx: 31, ty: 18, r: 80, c: "rgba(255, 180, 100, 0.5)"}); 
            lights.push({tx: 11, ty: 18, r: 70, c: "rgba(100, 255, 150, 0.45)"}); 
            for(let tx of [12, 25, 15, 23]) {
                let ty = (tx === 12 || tx === 25) ? 14 : 22;
                lights.push({tx: tx+0.5, ty: ty+0.5, r: 70, c: "rgba(255, 200, 80, 0.5)"});
            }
            lights.push({tx: 19.5, ty: 12.5, r: 110, c: "rgba(200, 230, 255, 0.25)"}); 
        } else if (G.map === 'snowPath') {
            for(let tx of [12, 15, 18]) {
                lights.push({tx: tx+0.5, ty: 5.5, r: 60, c: "rgba(255, 200, 80, 0.4)"});
            }
            lights.push({tx: 19, ty: 8, r: 120, c: "rgba(120, 80, 255, 0.4)"});
        }

        for(let l of lights) {
            let lx = (l.tx !== undefined ? l.tx * TS : l.x) - cx;
            let ly = (l.ty !== undefined ? l.ty * TS : l.y) - cy;
            if(lx < -l.r || lx > GW + l.r || ly < -l.r || ly > GH + l.r) continue;
            let g = X.createRadialGradient(lx, ly, 0, lx, ly, l.r);
            g.addColorStop(0, l.c); g.addColorStop(1, "rgba(0,0,0,0)");
            X.fillStyle = g;
            X.beginPath(); X.arc(lx, ly, l.r, 0, Math.PI*2); X.fill();
        }
    } else if (isCave) {
        X.fillStyle = "rgba(2, 4, 12, 0.98)";
        X.globalCompositeOperation = "source-over";
        X.fillRect(0, 0, GW, GH);
        X.globalCompositeOperation = "screen";
        const ptx = (G.opx + (G.px - G.opx) * (1 - mvT / 160)) * TS - cx + 8;
        const pty = (G.opy + (G.py - G.opy) * (1 - mvT / 160)) * TS - cy + 8;
        let pGrd = X.createRadialGradient(ptx, pty, 0, ptx, pty, 100);
        pGrd.addColorStop(0, "rgba(120, 80, 255, 0.5)");
        pGrd.addColorStop(1, "rgba(0, 0, 0, 0)");
        X.fillStyle = pGrd;
        X.beginPath(); X.arc(ptx, pty, 100, 0, Math.PI*2); X.fill();

        const map = MAPS[G.map];
        for(let ty = 0; ty < map.h; ty++) {
            for(let tx = 0; tx < map.w; tx++) {
                if(gT(G.map, tx, ty) === 33) {
                    let lx = tx * TS - cx + 8, ly = ty * TS - cy + 8;
                    let g = X.createRadialGradient(lx, ly, 0, lx, ly, 70);
                    g.addColorStop(0, "rgba(94, 234, 212, 0.6)");
                    g.addColorStop(1, "rgba(0,0,0,0)");
                    X.fillStyle = g;
                    X.beginPath(); X.arc(lx, ly, 70, 0, Math.PI*2); X.fill();
                }
            }
        }
    } else {
        let grd = X.createRadialGradient(GW/2, GH/2, 0, GW/2, GH/2, GW*1.2);
        grd.addColorStop(0, "rgba(255, 230, 200, 0.15)");
        grd.addColorStop(1, "rgba(10, 5, 2, 0.9)");
        X.globalCompositeOperation = "source-over";
        X.fillStyle = grd;
        X.fillRect(0, 0, GW, GH);

        if (G.map === 'snowLodge') {
            X.globalCompositeOperation = "screen";
            let fx = 143 - cx, fy = 58 - cy;
            let fg = X.createRadialGradient(fx, fy, 0, fx, fy, 140);
            let flicker = 0.5 + Math.sin(TK*0.8)*0.2;
            fg.addColorStop(0, `rgba(255, 120, 30, ${flicker})`);
            fg.addColorStop(1, "rgba(0,0,0,0)");
            X.fillStyle = fg;
            X.beginPath(); X.arc(fx, fy, 140, 0, Math.PI*2); X.fill();
            let wg = X.createRadialGradient(36-cx, 40-cy, 0, 36-cx, 40-cy, 80);
            wg.addColorStop(0, "rgba(200, 240, 255, 0.35)"); wg.addColorStop(1, "rgba(0,0,0,0)");
            X.fillStyle = wg; X.beginPath(); X.arc(36-cx, 40-cy, 80, 0, Math.PI*2); X.fill();
        }
    }
    X.restore();
}

function drawFootprints(cx, cy) {
    X.save();
    for(let fp of footprints) {
        if(fp.map !== G.map) continue;
        let dx = fp.x * TS - cx, dy = fp.y * TS - cy;
        X.fillStyle = `rgba(140, 160, 190, ${fp.life / 600 * 0.45})`;
        X.beginPath(); X.ellipse(dx+8, dy+12, 4, 2, 0, 0, Math.PI*2); X.fill();
    }
    X.restore();
}

function drawBreath(cx, cy) {
    for(let b of breaths) {
        let dx = b.x - cx, dy = b.y - cy;
        X.fillStyle = `rgba(255, 255, 255, ${b.life / 80 * 0.6})`;
        X.beginPath(); X.arc(dx, dy, b.s, 0, Math.PI*2); X.fill();
    }
}

function dWorld() {
    const map = MAPS[G.map];
    const t2 = mvT > 0 ? Math.max(0, 1 - mvT / 160) : 1;
    const dpx = G.opx + (G.px - G.opx) * t2;
    const dpy = G.opy + (G.py - G.opy) * t2;
    const rawCx = dpx * TS - GW/2 + TS/2;
    const rawCy = dpy * TS - GH/2 + TS/2;
    const mw = map.w * TS, mh = map.h * TS;
    const cx = (mw <= GW) ? -((GW - mw) / 2) : Math.max(0, Math.min(rawCx, mw - GW));
    const cy = (mh <= GH) ? -((GH - mh) / 2) : Math.max(0, Math.min(rawCy, mh - GH));

    X.fillStyle = "#000"; X.fillRect(0, 0, GW, GH);

    for(let ty = Math.max(0, ~~(cy/TS)-1); ty < Math.min(map.h, ~~(cy/TS)+GH/TS+2); ty++) {
        for(let tx = Math.max(0, ~~(cx/TS)-1); tx < Math.min(map.w, ~~(cx/TS)+GW/TS+2); tx++) {
            dTile(~~(tx*TS - cx), ~~(ty*TS - cy), gT(G.map, tx, ty), tx, ty);
        }
    }

    drawFootprints(cx, cy);
    drawLocalFlavor(G.map, cx, cy);

    if (map.npcs) {
        for(let n of map.npcs) {
            let nx = ~~(n.x*TS - cx), ny = ~~(n.y*TS - cy);
            X.fillStyle = 'rgba(0,0,0,0.4)'; X.beginPath(); X.ellipse(nx+8, ny+14, 6, 2, 0, 0, Math.PI*2); X.fill();
            const bob = Math.sin(TK*0.05 + n.x)*0.5 > 0 ? 1 : 0;
            drawDemoSprite(n.sn || "npc", nx+2, ny+2-bob);
        }
    }

    const px = ~~(dpx * TS - cx), py = ~~(dpy * TS - cy);
    X.fillStyle = 'rgba(0,0,0,0.5)'; X.beginPath(); X.ellipse(px+8, py+14, 6, 2, 0, 0, Math.PI*2); X.fill();
    drawDemoSprite('pl_' + G.face, px+2, py+2);

    drawLighting(cx, cy);

    if (G.map === 't3' || G.map === 'snowPath' || G.map.startsWith('cave')) {
        X.fillStyle = "#fff";
        for(let p of particles) {
            X.globalAlpha = p.a;
            if(p.type === 'snow') {
                X.beginPath(); X.arc(p.x, p.y, p.s, 0, Math.PI*2); X.fill();
            } else if (p.type === 'sparkle') {
                X.fillStyle = "#a080ff";
                X.fillRect(p.x, p.y, p.s, p.s);
            } else if (p.type === 'ember') {
                X.fillStyle = "#e67e22";
                X.fillRect(p.x, p.y, p.s, p.s);
            }
        }
        X.globalAlpha = 1;
        drawBreath(cx, cy);
    }

    let vg = X.createRadialGradient(GW/2, GH/2, GH*0.4, GW/2, GH/2, GH*0.9);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.85)");
    X.globalCompositeOperation = "source-over";
    X.fillStyle = vg;
    X.fillRect(0, 0, GW, GH);

    if (fadeAmt > 0) {
        X.fillStyle = `rgba(0,0,0,${fadeAmt})`;
        X.fillRect(0, 0, GW, GH);
    }
}

function dMsg() {
    if (!U.msg) return;
    U.msgI = Math.min(U.msgI + 1.0, U.msg.length);

    const bx = 16, bw = GW - 32;
    const bh = 100, by = GH - bh - 20;

    X.fillStyle = "rgba(4, 12, 28, 0.92)";
    X.fillRect(bx, by, bw, bh);
    let boxGrad = X.createLinearGradient(bx, by, bx, by + bh);
    boxGrad.addColorStop(0, "rgba(255,255,255,0.08)");
    boxGrad.addColorStop(1, "rgba(0,0,0,0)");
    X.fillStyle = boxGrad;
    X.fillRect(bx, by, bw, bh);
    X.strokeStyle = "#e1b12c"; 
    X.lineWidth = 1.5;
    X.strokeRect(bx, by, bw, bh);
    X.strokeStyle = "rgba(225, 177, 44, 0.3)"; 
    X.lineWidth = 3;
    X.strokeRect(bx-1.5, by-1.5, bw+3, bh+3);
    X.font = "14px 'Hiragino Sans', sans-serif";
    X.textBaseline = "top";

    let textY = by + 16;
    if (U.msgName) {
        X.fillStyle = "#f39c12"; 
        X.fillText(U.msgName, bx + 16, textY);
        X.fillStyle = "rgba(255,255,255,0.2)";
        X.fillRect(bx + 16, textY + 16, bw - 32, 1); 
        textY += 24;
    }

    const vis = U.msg.substring(0, ~~U.msgI);
    const ls = vis.split("\n");
    X.fillStyle = "#f8f9fa";
    for(let i=0; i<ls.length; i++) {
        X.fillText(ls[i], bx + 16, textY + i * 22);
    }

    if (U.msgI >= U.msg.length) {
        X.fillStyle = `rgba(241, 196, 15, ${0.5 + Math.sin(TK*0.15)*0.5})`;
        X.beginPath(); X.moveTo(bx + bw - 24, by + bh - 24); X.lineTo(bx + bw - 16, by + bh - 24); X.lineTo(bx + bw - 20, by + bh - 16); X.fill();
    }
}

function dTitle() {
    X.fillStyle = "#010204"; X.fillRect(0,0,GW,GH);
    X.fillStyle = "#fff";
    for(let p of particles) {
        if(p.type === 'snow') {
            X.globalAlpha = p.a * 0.8;
            X.beginPath(); X.arc(p.x, p.y, p.s, 0, Math.PI*2); X.fill();
        }
    }
    X.globalAlpha = 1;

    X.shadowColor = "rgba(140, 220, 255, 1)"; X.shadowBlur = 30;
    X.fillStyle = "#ffffff";
    X.font = "bold 28px 'Hiragino Sans', sans-serif";
    X.textAlign = "center"; X.textBaseline = "middle";
    X.fillText("ルミナリア伝説", GW/2, GH/3 - 15);

    X.font = "12px 'Hiragino Sans', sans-serif";
    X.fillStyle = "#aaddff";
    X.fillText("- 雪あかりの村と洞窟 -", GW/2, GH/3 + 20);
    X.shadowBlur = 0;

    X.font = "14px 'Hiragino Sans', sans-serif";
    let pulse = 0.5 + Math.sin(TK*0.06)*0.5;
    X.fillStyle = `rgba(255, 255, 255, ${pulse})`;
    X.fillText("Tap to Start", GW/2, GH * 0.7);

    if (fadeAmt > 0) {
        X.fillStyle = `rgba(0,0,0,${fadeAmt})`;
        X.fillRect(0, 0, GW, GH);
    }
}

function showMsg(msg, name) {
    U.msg = msg.replace(/\\n/g, "\n");
    U.msgName = name || null;
    U.msgI = 0;
}

function checkExits() {
    const list = WORLD_PORTALS[G.map] || [];
    for (let e of list) {
        if (G.px === e.fx && G.py === e.fy) {
            G.map = e.to; G.px = e.tx; G.py = e.ty;
            G.opx = G.px; G.opy = G.py;
            G.face = "d";
            playSfx('door');
            fadeAmt = 1.0; 
            particles = []; worldParticles = []; footprints = [];
            return true;
        }
    }
    return false;
}

function uWorld(inp) {
    if (U.msg) {
        if (inp.a || inp.b) {
            if (U.msgI < U.msg.length) U.msgI = U.msg.length;
            else U.msg = null;
        }
        return;
    }

    if (mvT > 0) {
        mvT -= 16;
        if (mvT <= 0) {
            mvT = 0;
            if (G.map === 't3' || G.map === 'snowPath') {
                footprints.push({map: G.map, x: G.opx, y: G.opy, life: 600});
            }
            checkExits();
        }
        return;
    }

    if (inp.dir && fadeAmt === 0) {
        G.face = inp.dir;
        let nx = G.px, ny = G.py;
        if (inp.dir === "u") ny--; if (inp.dir === "d") ny++;
        if (inp.dir === "l") nx--; if (inp.dir === "r") nx++;

        if (canW(G.map, nx, ny)) {
            let blocked = false;
            const map = MAPS[G.map];
            if (map.npcs) {
                for(let n of map.npcs) if(n.x===nx && n.y===ny) { blocked = true; break; }
            }
            if (!blocked) {
                G.opx = G.px; G.opy = G.py;
                G.px = nx; G.py = ny;
                mvT = 160;
                playStep();
            }
        }
    } else if (inp.a && fadeAmt === 0) {
        let fx = G.px, fy = G.py;
        if (G.face === "u") fy--; if (G.face === "d") fy++;
        if (G.face === "l") fx--; if (G.face === "r") fx++;

        const spots = WORLD_SPOTS[G.map] || [];
        for(let s of spots) {
            if (s.fx === fx && s.fy === fy) {
                playSfx('sel'); showMsg(s.msg); return;
            }
        }
        const map = MAPS[G.map];
        if (map.signs) {
            for(let s of map.signs) {
                if(s.x === fx && s.y === fy) {
                    playSfx('sel'); showMsg(s.msg); return;
                }
            }
        }

        if (map.npcs) {
            for(let n of map.npcs) {
                if (n.x === fx && n.y === fy) {
                    playSfx('sel'); showMsg(n.msg, n.nm); return;
                }
            }
        }

        if (G.map === 'cave1' && fy <= 2) {
            playSfx('cancel');
            showMsg("「この先は さらに 深い 洞窟だ。\n デモ版の 探索は ここまでに しておこう」");
        }
    }
}

let lt = 0;
function loop(ts) {
    lt = ts;
    TK++;
    if (fadeAmt > 0) fadeAmt = Math.max(0, fadeAmt - 0.05);
    dJoy();
    let inp = getInputs();

    if (G.st === "TITLE") {
        if (inp.a || inp.b || jAct) {
            playSfx('sel');
            startAmbientBGM();
            fadeAmt = 1.0;
            G.st = "WORLD";
        }
        updateEffects();
        dTitle();
    } else if (G.st === "WORLD") {
        uWorld(inp);
        updateEffects();
        dWorld();
        dMsg();
    }

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
