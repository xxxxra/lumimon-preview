function drawSpr(k, px, py, flip=false) {
    const d = SPRITES[k] || SPRITES['girl'];

        if(col) { X.fillStyle = col; X.fillRect(px+c, py+r, 1, 1); }

// --- 室内・3番道路マップジェネレーター ---
function createRoom(type) {
    const w = 13, h = 13;
    let t = new Array(w * h).fill(101); // 壁
    for(let y=3; y<h-1; y++) {
        for(let x=1; x<w-1; x++) { t[y*w+x] = 100; } // 床
    }
    t[(h-2)*w + 6] = 103; // 出口マット

    if(type === 'center') {
        for(let x=4; x<=8; x++) t[5*w+x] = 102; 
        t[4*w+6] = 105; 
        t[8*w+2] = 106; t[8*w+10] = 106; 
    } else if(type === 'shop') {
        for(let x=2; x<=4; x++) t[5*w+x] = 102;
        for(let x=8; x<=10; x++) t[5*w+x] = 102;
        for(let x=2; x<=10; x++) { if(x!==6) t[8*w+x] = 104; }
    } else if(type === 'cafe') {
        for(let x=5; x<=7; x++) t[4*w+x] = 105; 
        t[7*w+3] = 102; t[7*w+9] = 102; 
        t[9*w+3] = 102; t[9*w+9] = 102;
    } else if(type === 'gym') {
        for(let y=3; y<h-1; y++) {
            for(let x=1; x<w-1; x++) { t[y*w+x] = 108; } 
        }
        for(let y=5; y<h-1; y++) { t[y*w+6] = 100; } 
        for(let y=4; y<=6; y++) {
            for(let x=4; x<=8; x++) { t[y*w+x] = 100; } 
        }
        t[3*w+6] = 102; 
        t[4*w+4] = 105; t[4*w+8] = 105; 
    } else {
        t[4*w+2] = 102; t[4*w+3] = 102; 
        t[6*w+6] = 107; 
        t[4*w+10] = 104; 
        t[8*w+2] = 106; 
    }
    return t;
}

function createShipInterior() {
    const w = 19, h = 15;
    const t = new Array(w * h).fill(101);
    const put = (x, y, v) => { if(x >= 0 && x < w && y >= 0 && y < h) t[y * w + x] = v; };
    for(let y = 1; y < h - 1; y++) {
        for(let x = 1; x < w - 1; x++) put(x, y, 100);
    }
    for(let y = 1; y < h - 1; y++) {
        put(8, y, 109); put(9, y, 109); put(10, y, 109);
    }
    put(9, 13, 103);
    put(9, 1, 103);

    [[3,4],[4,4],[3,8],[4,8],[13,4],[14,4],[13,8],[14,8],[6,6],[12,6]].forEach(([x,y]) => put(x,y,102));
    [[15,3],[15,9],[3,11],[14,11]].forEach(([x,y]) => put(x,y,104));
    [[2,2],[16,2],[9,3],[9,11]].forEach(([x,y]) => put(x,y,105));
    [[2,10],[16,10],[5,11],[13,11]].forEach(([x,y]) => put(x,y,106));
    [[4,6],[14,6]].forEach(([x,y]) => put(x,y,107));
    return t;
}

function createRoute3() {
    const w = 18, h = 14;
    const t = new Array(w * h).fill(110);
    const put = (x, y, v) => { if(x >= 0 && x < w && y >= 0 && y < h) t[y * w + x] = v; };
    const rect = (x, y, ww, hh, v) => { for(let iy = y; iy < y + hh; iy++) for(let ix = x; ix < x + ww; ix++) put(ix, iy, v); };

    rect(0, 10, 6, 4, 21);
    rect(5, 8, 4, 6, 21);
    rect(8, 4, 4, 6, 21);
    rect(10, 0, 3, 5, 21);

    [[1,9],[2,9],[13,2],[14,2],[15,2],[14,7],[15,7],[16,7],[5,3],[4,3],[3,3],[15,11],[16,11]].forEach(([x,y]) => put(x,y,112));
    [[2,8],[3,8],[4,8],[12,9],[13,9],[14,9],[15,9]].forEach(([x,y]) => put(x,y,3));

    put(2, 12, 111);
    put(11, 1, 111);
    return t;
}

function createSnowVillage() {
    const w = 20, h = 15;
    const t = new Array(w * h).fill(110);
    const put = (x, y, v) => { if(x >= 0 && x < w && y >= 0 && y < h) t[y * w + x] = v; };
    const rect = (x, y, ww, hh, v) => { for(let iy = y; iy < y + hh; iy++) for(let ix = x; ix < x + ww; ix++) put(ix, iy, v); };

    rect(8, 10, 4, 5, 21);
    rect(5, 7, 10, 4, 21);
    rect(6, 3, 3, 5, 21);
    rect(12, 3, 3, 5, 21);

    [[2,2],[3,2],[4,2],[15,2],[16,2],[17,2],[2,12],[3,12],[16,12],[17,12],[1,8],[18,8],[9,2],[10,2]].forEach(([x,y]) => put(x,y,112));
    put(10, 14, 111);
    return t;
}

let currentMap = "city";

function getT(x, y) { 
    const m = MAPS[currentMap];
    if (x < 0 || y < 0 || x >= m.w || y >= m.h) return 8; 
    return m.data[y * m.w + x]; 
}
function canW(x, y) { 
    const t = getT(x,y);
    return t === 0 || t === 11 || t === 20 || t === 21 || t === 100 || t === 103 || t === 109 || t === 110 || t === 111; 
}

const JC = document.getElementById("jc"), JX = JC.getContext("2d");
let jx = 0, jy = 0, jAct = false;
function jUpd(cx, cy){ const dx=cx-60, dy=cy-60, dist=Math.sqrt(dx*dx+dy*dy); if(dist>36){jx=dx/dist*36; jy=dy/dist*36;} else {jx=dx; jy=dy;} }
["touchstart", "touchmove"].forEach(ev => JC.addEventListener(ev, e => { e.preventDefault(); jAct=true; const r=JC.getBoundingClientRect(); jUpd(e.touches[0].clientX-r.left, e.touches[0].clientY-r.top); }, {passive:false}));
["touchend", "touchcancel"].forEach(ev => JC.addEventListener(ev, e => { e.preventDefault(); jAct=false; jx=0; jy=0; }, {passive:false}));
JC.addEventListener("mousedown", e => { jAct = true; const r = JC.getBoundingClientRect(); jUpd(e.clientX - r.left, e.clientY - r.top); });
document.addEventListener("mousemove", e => { if(!jAct) return; const r = JC.getBoundingClientRect(); jUpd(e.clientX - r.left, e.clientY - r.top); });
document.addEventListener("mouseup", () => { jAct = false; jx = 0; jy = 0; });
let keys = {};
document.addEventListener("keydown", e => { keys[e.key]=true; });
document.addEventListener("keyup", e => { keys[e.key]=false; });

let ripples = [];
function addRipple(e) {
    if(currentMap !== 'city') return;
    const r = C.getBoundingClientRect();
    const mx = (e.clientX || e.touches[0].clientX) - r.left;
    const my = (e.clientY || e.touches[0].clientY) - r.top;
    const worldX = window.currentCamX + mx / SC;
    const worldY = window.currentCamY + my / SC;
    if(getT(Math.floor(worldX/TS), Math.floor(worldY/TS)) === 3) { 
        ripples.push({x: worldX, y: worldY, r: 0, life: 0});
    }
}
C.addEventListener("mousedown", addRipple);
C.addEventListener("touchstart", e => { e.preventDefault(); addRipple(e); }, {passive:false});

// --- HD-2D風・美麗なタイル・家具描画 ---
function drawTile(dx, dy, t, tx, ty) {
    // 3番道路（雪原）
    if(t === 110) { 
        X.fillStyle = '#f4f8fb'; X.fillRect(dx, dy, TS, TS); 
        X.fillStyle = '#e4edf5'; X.fillRect(dx, dy+TS-2, TS, 2); 
        return; 
    }
    if(t === 111) { 
        X.fillStyle = '#f4f8fb'; X.fillRect(dx, dy, TS, TS); 
        X.fillStyle = '#3498db'; X.fillRect(dx+2, dy+2, TS-4, TS-4); 
        return; 
    }
    if(currentMap === 'ship') {
        if(t === 109) {
            X.fillStyle = '#203452'; X.fillRect(dx, dy, TS, TS);
            X.fillStyle = '#d6b36a'; X.fillRect(dx, dy, 2, TS); X.fillRect(dx+TS-2, dy, 2, TS);
            X.fillStyle = 'rgba(255,255,255,0.06)'; X.fillRect(dx+2, dy+2, TS-4, TS-4);
            return;
        }
        if(t === 100 || t === 103) {
            const floor = X.createLinearGradient(0, dy, 0, dy + TS);
            floor.addColorStop(0, '#5e402c'); floor.addColorStop(1, '#3a2418');
            X.fillStyle = floor; X.fillRect(dx, dy, TS, TS);
            X.fillStyle = '#714d35'; X.fillRect(dx, dy+4, TS, 1); X.fillRect(dx, dy+12, TS, 1);
            X.fillStyle = 'rgba(255,255,255,0.05)'; X.fillRect(dx+1, dy+1, TS-2, 2);
            if(t === 103) {
                X.fillStyle = 'rgba(198, 51, 70, 0.85)'; X.fillRect(dx+2, dy+2, TS-4, TS-4);
                X.fillStyle = 'rgba(255,255,255,0.15)'; X.fillRect(dx+2, dy+2, TS-4, 1);
            }
            return;
        }
        if(t === 101) {
            const wall = X.createLinearGradient(0, dy, 0, dy + TS);
            wall.addColorStop(0, '#11263d'); wall.addColorStop(1, '#0b1727');
            X.fillStyle = wall; X.fillRect(dx, dy, TS, TS);
            X.fillStyle = '#6a4c2c'; X.fillRect(dx, dy+TS-4, TS, 4);
            X.fillStyle = 'rgba(255,255,255,0.06)'; X.fillRect(dx, dy, TS, 1);
            if((ty === 0 || ty === 14) && (tx === 4 || tx === 9 || tx === 14)) {
                X.fillStyle = '#c89b45'; X.beginPath(); X.arc(dx+8, dy+8, 5, 0, Math.PI*2); X.fill();
                X.fillStyle = '#9fd5ff'; X.beginPath(); X.arc(dx+8, dy+8, 3.5, 0, Math.PI*2); X.fill();
            }
            return;
        }
        if(t === 102) {
            X.fillStyle = '#14263c'; X.fillRect(dx, dy+TS-8, TS, 8);
            X.fillStyle = '#223f66'; X.fillRect(dx, dy+TS-12, TS, 4);
            X.fillStyle = '#d6b36a'; X.fillRect(dx, dy+TS-13, TS, 1);
            return;
        }
        if(t === 104) {
            X.fillStyle = '#3c2a1c'; X.fillRect(dx+1, dy+2, TS-2, TS-2);
            X.fillStyle = '#6d4b2f'; X.fillRect(dx+2, dy+3, TS-4, TS-4);
            X.fillStyle = '#b9873d'; X.fillRect(dx+4, dy+5, TS-8, 2);
            X.fillStyle = 'rgba(0,0,0,0.25)'; X.fillRect(dx+2, dy+TS-4, TS-4, 2);
            return;
        }
        if(t === 105) {
            X.fillStyle = '#2d3948'; X.fillRect(dx+2, dy+2, TS-4, TS-2);
            X.fillStyle = '#c79c4a'; X.fillRect(dx+5, dy+4, 6, 6);
            X.fillStyle = '#ffdc8d'; X.fillRect(dx+6, dy+5, 4, 4);
            lightSources.push({x: dx+8, y: dy+8, r: 54, c: 'rgba(255, 202, 120, 0.48)'});
            return;
        }
        if(t === 106) {
            X.fillStyle = '#d1d9e5'; X.beginPath(); X.arc(dx+8, dy+8, 5, 0, Math.PI*2); X.fill();
            X.fillStyle = '#d24b52'; X.beginPath(); X.arc(dx+8, dy+8, 3, 0, Math.PI*2); X.fill();
            X.fillStyle = '#d1d9e5'; X.fillRect(dx+7, dy+2, 2, 12); X.fillRect(dx+2, dy+7, 12, 2);
            return;
        }
        if(t === 107) {
            X.fillStyle = '#334b63'; X.fillRect(dx+1, dy+3, TS-2, TS-6);
            X.fillStyle = '#98d0ff'; X.fillRect(dx+3, dy+5, TS-6, TS-10);
            X.fillStyle = '#d6b36a'; X.fillRect(dx+4, dy+6, 4, 1); X.fillRect(dx+8, dy+8, 3, 1);
            return;
        }
    }

    // 室内タイル
    if(t >= 100) { 
        let fC = '#3e2723', fLine = '#2d1c15'; 
        let wC = '#e0e0e0', wBot = '#7f8c8d', wTop = '#b0b0b0'; 

        if(currentMap === 'center') { fC = '#ecf0f1'; fLine = '#dce4ec'; wC = '#ffffff'; wBot = '#e74c3c'; wTop = '#d1d8e0'; }
        if(currentMap === 'shop') { fC = '#2c3e50'; fLine = '#1a252f'; wC = '#1e2b3c'; wBot = '#3498db'; wTop = '#0f171e'; }
        if(currentMap === 'cafe') { fC = '#2d1c15'; fLine = '#1f130e'; wC = '#4e342e'; wBot = '#1a100b'; wTop = '#2d1c15'; }
        if(currentMap === 'gym') { fC = '#121620'; fLine = '#0a0d14'; wC = '#0d131f'; wBot = '#2980b9'; wTop = '#04070d'; }
        if(currentMap.startsWith('house') || currentMap.startsWith('villa')) { fC = '#4e342e'; fLine = '#3e2723'; wBot = '#1abc9c'; }

        if(t === 100) { // 床
            X.fillStyle = fC; X.fillRect(dx, dy, TS, TS);
            X.fillStyle = fLine; 
            if(currentMap === 'center' || currentMap === 'shop' || currentMap === 'gym') {
                X.fillRect(dx, dy, TS, 1); X.fillRect(dx, dy, 1, TS);
                X.fillStyle = 'rgba(255,255,255,0.03)'; X.fillRect(dx+1, dy+1, TS-2, TS-2); 
            } else {
                X.fillRect(dx, dy+4, TS, 1); X.fillRect(dx, dy+12, TS, 1); 
                if((tx*ty)%3===0) { X.fillStyle='rgba(0,0,0,0.1)'; X.fillRect(dx, dy, TS, TS); }
            }
            return;
        }
        if(t === 101) { // 壁
            let wallGrd = X.createLinearGradient(0, dy, 0, dy+TS);
            wallGrd.addColorStop(0, wTop); wallGrd.addColorStop(1, wC);
            X.fillStyle = wallGrd; X.fillRect(dx, dy, TS, TS);
            X.fillStyle = wBot; X.fillRect(dx, dy+TS-4, TS, 4); 
            X.fillStyle = 'rgba(255,255,255,0.15)'; X.fillRect(dx, dy+TS-4, TS, 1);
            X.fillStyle = 'rgba(0,0,0,0.4)'; X.fillRect(dx, dy+TS-1, TS, 1);

            if(currentMap !== 'gym' && ty === 2 && (tx === 4 || tx === 5 || tx === 7 || tx === 8)) {
                X.fillStyle = '#2c3e50'; X.fillRect(dx, dy+4, TS, TS-4); 
                let winGrd = X.createLinearGradient(0, dy+4, 0, dy+TS);
                winGrd.addColorStop(0, '#e67e22'); winGrd.addColorStop(1, '#8e44ad');
                X.fillStyle = winGrd; X.fillRect(dx+2, dy+6, TS-4, TS-6);
                X.fillStyle = 'rgba(255,255,255,0.4)'; X.beginPath(); X.moveTo(dx+TS-4, dy+6); X.lineTo(dx+2, dy+TS-2); X.lineTo(dx+2, dy+TS-6); X.lineTo(dx+TS-8, dy+6); X.fill();
            }
            return; 
        }
        if(t === 103) { // 出口マット
            X.fillStyle = fC; X.fillRect(dx, dy, TS, TS);
            X.fillStyle = '#c0392b'; X.fillRect(dx+1, dy+2, TS-2, TS-2);
            return; 
        }
        if(t === 108) { // 水（ジム）
            X.fillStyle = '#0a2a3a'; X.fillRect(dx, dy, TS, TS);
            X.fillStyle = 'rgba(41, 128, 185, 0.5)'; X.fillRect(dx, dy, TS, TS);
            X.fillStyle = 'rgba(100, 200, 255, 0.15)'; 
            X.fillRect(dx+2, dy+4+Math.sin(TK*0.03+tx)*2, 12, 1);
            X.fillRect(dx+4, dy+10+Math.cos(TK*0.04+tx)*2, 8, 1);
            return;
        }

        X.fillStyle = fC; X.fillRect(dx, dy, TS, TS);
        X.fillStyle = 'rgba(0,0,0,0.5)'; X.fillRect(dx+2, dy+TS-2, TS, 6); 

        if(t === 102) { // 家具・テーブル
            let h = 8;
            if(currentMap === 'center') {
                X.fillStyle = '#bdc3c7'; X.fillRect(dx, dy+TS-h, TS, h); 
                X.fillStyle = '#ffffff'; X.fillRect(dx, dy+TS-h-6, TS, 6); 
                X.fillStyle = '#e74c3c'; X.fillRect(dx, dy+TS-h+2, TS, 2); 
            } else if(currentMap === 'shop') {
                X.fillStyle = '#2980b9'; X.fillRect(dx, dy+TS-h, TS, h); 
                X.fillStyle = '#3498db'; X.fillRect(dx, dy+TS-h-6, TS, 6); 
                X.fillStyle = '#f1c40f'; X.fillRect(dx+2, dy+TS-h-4, 4, 4); X.fillStyle = '#e74c3c'; X.fillRect(dx+8, dy+TS-h-2, 4, 4);
            } else if(currentMap === 'cafe') {
                X.fillStyle = '#1a100b'; X.beginPath(); X.arc(dx+8, dy+TS-4, 7, 0, Math.PI*2); X.fill(); 
                X.fillStyle = '#f1c40f'; X.beginPath(); X.arc(dx+6, dy+TS-5, 2, 0, Math.PI*2); X.fill(); 
                lightSources.push({x: dx+6, y: dy+TS-5, r: 40, c: "rgba(241, 196, 15, 0.4)"});
            } else if(currentMap === 'gym') {
                X.fillStyle = '#f39c12'; X.fillRect(dx+2, dy+TS-12, 12, 12); 
                X.fillStyle = '#f1c40f'; X.fillRect(dx+2, dy+TS-16, 12, 4); 
            } else { 
                X.fillStyle = '#1e2b3c'; X.fillRect(dx, dy+TS-h, TS, h); 
                X.fillStyle = '#2c3e50'; X.fillRect(dx, dy+TS-h-6, TS, 6); 
                X.fillStyle = '#fff'; X.fillRect(dx+2, dy+TS-h-4, 8, 4); 
            }
            return;
        }
        if(t === 104) { // 棚
            X.fillStyle = '#3e2723'; X.fillRect(dx, dy+TS-14, TS, 14); 
            X.fillStyle = '#5c4033'; X.fillRect(dx, dy+TS-18, TS, 4); 
            X.fillStyle = '#1a100b'; X.fillRect(dx+2, dy+TS-12, TS-4, 10); 
            const cols = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#ecf0f1'];
            for(let i=0; i<3; i++) {
                X.fillStyle = cols[(tx+i)%cols.length];
                X.fillRect(dx+3+i*4, dy+TS-10+(i%2), 2, 6-(i%2)); 
            }
            return;
        }
        if(t === 105) { // 設備
            if(currentMap === 'center') {
                X.fillStyle = '#7f8c8d'; X.fillRect(dx+2, dy+TS-12, TS-4, 12);
                X.fillStyle = '#ecf0f1'; X.fillRect(dx+2, dy+TS-16, TS-4, 4);
                X.fillStyle = '#2ecc71'; X.beginPath(); X.arc(dx+8, dy+TS-14, 3, 0, Math.PI*2); X.fill(); 
                lightSources.push({x: dx+8, y: dy+TS-14, r: 50, c: "rgba(46, 204, 113, 0.6)"});
            } else if(currentMap === 'cafe') {
                X.fillStyle = '#2c3e50'; X.fillRect(dx, dy+TS-10, TS, 10); 
                X.fillStyle = '#34495e'; X.fillRect(dx, dy+TS-14, TS, 4); 
                X.fillStyle = '#ecf0f1'; X.fillRect(dx+2, dy+TS-12, 2, 2); 
            } else if(currentMap === 'gym') {
                X.fillStyle = '#0a3a4a'; X.fillRect(dx+2, dy, 12, TS);
                X.fillStyle = '#1abc9c'; X.fillRect(dx+4, dy+2, 8, TS-4);
                lightSources.push({x: dx+8, y: dy+TS-8, r: 60, c: "rgba(26, 188, 156, 0.6)"});
            }
            return;
        }
        if(t === 106) { // 観葉植物
            X.fillStyle = '#2c3e50'; X.fillRect(dx+4, dy+TS-6, 8, 6); 
            X.fillStyle = '#1e8449'; X.beginPath(); X.arc(dx+8, dy+TS-10, 8, 0, Math.PI*2); X.fill();
            X.fillStyle = '#27ae60'; X.beginPath(); X.arc(dx+6, dy+TS-12, 5, 0, Math.PI*2); X.fill();
            return;
        }
        if(t === 107) { // 海図テーブル
            X.fillStyle = '#2c3e50'; X.fillRect(dx, dy+TS-8, TS, 8); 
            X.fillStyle = '#34495e'; X.fillRect(dx, dy+TS-12, TS, 4); 
            X.fillStyle = '#f5b041'; X.fillRect(dx+2, dy+TS-14, TS-4, 8); 
            X.fillStyle = '#c0392b'; X.fillRect(dx+4, dy+TS-12, 2, 2); 
            return;
        }
    }

    // 屋外タイル
    X.fillStyle = '#4fa362'; X.fillRect(dx, dy, TS, TS);

    if(t===0){ if((tx*7+ty)%2===0){X.fillStyle='#78cc89';X.fillRect(dx+3,dy+3,2,2);} return;}
    if(t===20){ 
        X.fillStyle='#aab6c4'; X.fillRect(dx,dy,TS,TS);
        X.fillStyle='#cbd5e1'; X.fillRect(dx+1,dy+1,14,14);
        X.fillStyle='#f1f5f9'; X.fillRect(dx+2,dy+2,2,2);
        return;
    }
    if(t===11){ 
        X.fillStyle='#d4c4a8'; X.fillRect(dx,dy,TS,TS); 
        if((tx+ty)%3===0){X.fillStyle='#c2b296';X.fillRect(dx+2,dy+2,4,2);} 
        return;
    }
    if(t===21){ 
        X.fillStyle='#8c7b6c'; X.fillRect(dx,dy,TS,TS);
        X.fillStyle='#6b5b4e'; X.fillRect(dx,dy+14,TS,2); X.fillRect(dx+7,dy,2,TS);
        if(currentMap === 'r3' || currentMap === 'snow') {
            X.fillStyle='rgba(255,255,255,0.08)'; X.fillRect(dx, dy+1, TS, 1);
            X.fillStyle='rgba(255,255,255,0.12)'; X.fillRect(dx+2, dy+3, 3, 1);
        }
        return;
    }
    if(t===112){
        X.fillStyle='#dfeaf7'; X.fillRect(dx,dy,TS,TS);
        X.fillStyle='#c8d9ee'; X.fillRect(dx,dy+TS-4,TS,4);
        X.fillStyle='rgba(255,255,255,0.45)'; X.fillRect(dx+2,dy+2,TS-4,4);
        X.fillStyle='rgba(181, 202, 228, 0.65)'; X.beginPath(); X.arc(dx+8,dy+10,5,0,Math.PI*2); X.fill();
        return;
    }
    if(t===3){ 
        let wg = X.createLinearGradient(0, dy, 0, dy+TS);
        wg.addColorStop(0, '#2980b9'); wg.addColorStop(1, '#1f618d');
        X.fillStyle = wg; X.fillRect(dx, dy, TS, TS);

        const wave = Math.sin(TK*0.04 + tx*0.5 + ty*0.2);
        if(wave > 0.5) {
            X.fillStyle = 'rgba(255,255,255,0.25)';
            X.fillRect(dx + 2, dy + 6, 12, 2);
        }

        if (ty > 0 && getT(tx, ty-1) === 11) {
            const shoreWave = Math.sin(TK*0.02 + tx*0.3);
            if(shoreWave > -0.5) {
                X.fillStyle = `rgba(255,255,255,${(shoreWave+0.5)*0.5})`;
                X.beginPath();
                X.moveTo(dx, dy + 6 - shoreWave*6);
                X.quadraticCurveTo(dx+TS/2, dy - shoreWave*8, dx+TS, dy + 6 - shoreWave*6);
                X.lineTo(dx+TS, dy); X.lineTo(dx, dy); X.fill();
            }
        }
        return;
    }
}

// === 屋外用の各種描画関数群 ===
function drawBackgroundEffects(cx, cy) {
    if(currentMap !== 'city') return;
    X.save();
    X.globalCompositeOperation = "color-dodge";
    for(let i=0; i<80; i++) {
        const wx = (i * 37 + TK * 0.15) % (GW + 100) - 50;
        const wy = (30 * TS - cy) + (i * 17) % (20 * TS);
        if (wy < 30 * TS - cy) continue;
        const wWidth = 15 + Math.sin(TK * 0.05 + i) * 20;
        X.fillStyle = `rgba(255, 120, 60, ${0.15 + Math.sin(TK * 0.08 + i)*0.2})`;
        X.fillRect(wx, wy, wWidth, 2);
    }
    X.restore();
}

function drawStreetLamp(x, y) {
    X.fillStyle = '#2c3e50'; X.fillRect(x-2, y-35, 4, 35);
    X.fillStyle = '#17222c'; X.fillRect(x-4, y, 8, 4);
    X.fillStyle = '#d35400'; X.fillRect(x-5, y-45, 10, 10);
    X.fillStyle = '#fffae6'; X.fillRect(x-3, y-43, 6, 6);
    X.fillStyle = '#2c3e50'; X.beginPath(); X.moveTo(x-6, y-45); X.lineTo(x+6, y-45); X.lineTo(x, y-51); X.closePath(); X.fill();
    lightSources.push({x: x, y: y-42, r: 80, c: "rgba(255, 200, 100, 0.45)"});
}

function drawPlanter(x, y) {
    X.fillStyle = 'rgba(0,0,0,0.3)'; X.fillRect(x+2, y+12, 12, 6);
    X.fillStyle = '#bdc3c7'; X.fillRect(x+2, y+8, 12, 6);
    X.fillStyle = '#95a5a6'; X.fillRect(x+2, y+10, 12, 4); 
    X.fillStyle = '#8b5a2b'; X.fillRect(x+4, y+8, 8, 2); 
    X.fillStyle = '#27ae60'; X.beginPath(); X.arc(x+6, y+6, 4, 0, Math.PI*2); X.fill();
    X.beginPath(); X.arc(x+10, y+6, 4, 0, Math.PI*2); X.fill();
    X.beginPath(); X.arc(x+8, y+4, 4, 0, Math.PI*2); X.fill();
    X.fillStyle = '#e74c3c'; X.fillRect(x+5, y+4, 2, 2); X.fillRect(x+9, y+5, 2, 2);
    X.fillStyle = '#f1c40f'; X.fillRect(x+7, y+3, 2, 2);
}

function drawStarfish(x, y) {
    X.save(); X.translate(x+8, y+8); X.rotate(TK*0.01 + x);
    X.fillStyle = 'rgba(0,0,0,0.2)'; X.beginPath(); X.arc(1, 1, 4, 0, Math.PI*2); X.fill();
    X.fillStyle = '#e74c3c';
    for(let i=0; i<5; i++) {
        X.beginPath(); X.moveTo(0, 0);
        X.lineTo(Math.cos(i*Math.PI*2/5)*4, Math.sin(i*Math.PI*2/5)*4);
        X.lineTo(Math.cos((i+0.5)*Math.PI*2/5)*1.5, Math.sin((i+0.5)*Math.PI*2/5)*1.5);
        X.lineTo(Math.cos((i-0.5)*Math.PI*2/5)*1.5, Math.sin((i-0.5)*Math.PI*2/5)*1.5);
        X.fill();
    }
    X.fillStyle = '#f1c40f'; X.beginPath(); X.arc(0, 0, 1.5, 0, Math.PI*2); X.fill();
    X.restore();
}

function drawMarineBuilding(x, y, w, h, roofColor, type, awningColor2) {
    const W = w * 16, H = h * 16;
    X.fillStyle = 'rgba(0,0,0,0.3)'; X.fillRect(x + 4, y + H - 2, W, 8); 
    X.fillStyle = '#ecf0f1'; X.fillRect(x + 2, y + 16, W - 4, H - 16); 
    X.fillStyle = '#bdc3c7'; X.fillRect(x + 2, y + 16, 2, H - 16); 

    X.fillStyle = roofColor;
    X.beginPath(); X.moveTo(x - 8, y + 16); X.lineTo(x + W / 2, y - 4); X.lineTo(x + W + 8, y + 16); X.closePath(); X.fill();
    X.fillStyle = 'rgba(0,0,0,0.2)'; X.fillRect(x - 8, y + 16, W + 16, 3);
    X.fillStyle = 'rgba(255,255,255,0.2)';
    X.beginPath(); X.moveTo(x - 8, y + 16); X.lineTo(x + W / 2, y - 4); X.lineTo(x + W / 2, y + 2); X.lineTo(x + 2, y + 16); X.fill();

    const dx = x + Math.floor(w/2) * 16, dy = y + H - 16;
    X.fillStyle = '#8b5a2b'; X.fillRect(dx, dy, 16, 16);
    X.fillStyle = '#3a2210'; X.fillRect(dx + 2, dy + 2, 12, 14);

    lightSources.push({x: dx+8, y: dy+8, r: 40, c: "rgba(255, 180, 80, 0.3)"});

    const winW = 12, winH = 16;
    X.fillStyle = '#fffae6'; 
    X.fillRect(x + 8, y + 28, winW, winH);
    X.fillRect(x + W - 20, y + 28, winW, winH);

    lightSources.push({x: x + 14, y: y + 36, r: 50, c: "rgba(255, 210, 100, 0.35)"});
    lightSources.push({x: x + W - 14, y: y + 36, r: 50, c: "rgba(255, 210, 100, 0.35)"});

    X.strokeStyle = '#34495e'; X.lineWidth = 2; 
    X.strokeRect(x + 8, y + 28, winW, winH); X.strokeRect(x + W - 20, y + 28, winW, winH);
    X.beginPath(); X.moveTo(x + 14, y + 28); X.lineTo(x + 14, y + 44); X.moveTo(x + 8, y + 36); X.lineTo(x + 20, y + 36); X.stroke();
    X.beginPath(); X.moveTo(x + W - 14, y + 28); X.lineTo(x + W - 14, y + 44); X.moveTo(x + W - 20, y + 36); X.lineTo(x + W - 8, y + 36); X.stroke();

    const awningW = 8;
    const awnings = 3;
    const startX = dx - (awnings*awningW) / 2 + 8;
    for(let i=0; i<awnings; i++) {
        X.fillStyle = i%2===0 ? roofColor : awningColor2;
        X.fillRect(startX + i*awningW, y + 16, awningW, 6);
        X.beginPath(); X.arc(startX + awningW/2 + i*awningW, y + 22, awningW/2, 0, Math.PI); X.fill();
    }

    const drawWinAwning = (wx) => {
        for(let i=0; i<2; i++) {
            X.fillStyle = i%2===0 ? roofColor : awningColor2;
            X.fillRect(wx - 2 + i*8, y + 24, 8, 4);
            X.beginPath(); X.arc(wx - 2 + 4 + i*8, y + 28, 4, 0, Math.PI); X.fill();
        }
    };
    drawWinAwning(x + 8);
    drawWinAwning(x + W - 20);

    if(type === 'center') {
        X.fillStyle = '#fff'; X.beginPath(); X.arc(x + W/2, y + 10, 8, 0, Math.PI*2); X.fill();
        X.fillStyle = '#e74c3c'; X.beginPath(); X.arc(x + W/2, y + 10, 8, Math.PI, 0); X.fill();
        X.fillStyle = '#2c3e50'; X.fillRect(x + W/2 - 8, y + 9, 16, 2); 
        X.beginPath(); X.arc(x + W/2, y + 10, 3, 0, Math.PI*2); X.fill();
        X.fillStyle = '#fff'; X.beginPath(); X.arc(x + W/2, y + 10, 1.5, 0, Math.PI*2); X.fill();
    } else if (type === 'shop') {
        X.fillStyle = '#f1c40f'; X.beginPath(); X.arc(x + W/2, y + 10, 8, 0, Math.PI*2); X.fill();
        X.fillStyle = '#3498db'; X.fillRect(x + W/2 - 5, y + 7, 10, 6);

function drawPalmTree(x, y) {
    X.fillStyle = 'rgba(0,0,0,0.4)'; X.beginPath(); X.ellipse(x+8, y+14, 12, 4, 0, 0, Math.PI*2); X.fill();
    X.strokeStyle = '#5c3a21'; X.lineWidth = 5; X.lineCap = 'round';
    X.beginPath(); X.moveTo(x+8, y+14); X.quadraticCurveTo(x+16, y, x+8, y-24); X.stroke();
    X.fillStyle = '#27ae60';
    for(let i=0; i<5; i++) {
        X.beginPath(); X.moveTo(x+8, y-24);
        const a = i * (Math.PI*2/5) + Math.sin(TK*0.02 + x)*0.1;
        X.quadraticCurveTo(x+8 + Math.cos(a-0.5)*20, y-24 + Math.sin(a-0.5)*20, x+8 + Math.cos(a)*30, y-24 + Math.sin(a)*15);
        X.quadraticCurveTo(x+8 + Math.cos(a+0.5)*20, y-24 + Math.sin(a+0.5)*20, x+8, y-24);
        X.fill();
    }
}

function drawObjects(cx, cy, dpx, dpy) {
    const cpx = (tx, ty) => [~~(tx * TS - cx), ~~(ty * TS - cy)];
    let renderList = [];

    if(currentMap === 'city') {
        palms.forEach(p => {
            const [px, py] = cpx(p[0], p[1]);
            renderList.push({ y: p[1]*TS + 14, draw: () => drawPalmTree(px, py) });
        });

        planters.forEach(p => {
            const [px, py] = cpx(p[0], p[1]);
            renderList.push({ y: p[1]*TS + 12, draw: () => drawPlanter(px, py) });
        });

        [[4,36], [10,38], [38,32], [48,34], [52,38]].forEach(p => {
            const [px, py] = cpx(p[0], p[1]);
            renderList.push({ y: p[1]*TS + 4, draw: () => drawStarfish(px, py) });
        });

        [[15,22], [30,22], [45,22], [20,32], [35,32], [14,38], [18,38], [41,38], [28,14], [40,14]].forEach(p => {
            const [sx, sy] = cpx(p[0], p[1]);
            renderList.push({ y: p[1]*TS + 5, draw: () => drawStreetLamp(sx+8, sy+14) });
        });

        const [fx, fy] = cpx(30, 22);
        renderList.push({ y: 22*TS + 24, draw: () => drawFountain(fx, fy) });

        const drawBench = (x, y) => {
            X.fillStyle = '#a04000'; X.fillRect(x, y+8, 16, 4); X.fillRect(x, y+4, 16, 2);
            X.fillStyle = '#2c3e50'; X.fillRect(x+2, y+8, 2, 6); X.fillRect(x+12, y+8, 2, 6);
        };

        const [b1x, b1y] = cpx(27, 24); renderList.push({ y: 24*TS + 12, draw: () => drawBench(b1x, b1y) });
        const [b2x, b2y] = cpx(33, 24); renderList.push({ y: 24*TS + 12, draw: () => drawBench(b2x, b2y) });
        const [b3x, b3y] = cpx(12, 33); renderList.push({ y: 33*TS + 12, draw: () => drawBench(b3x, b3y) });
        const [b4x, b4y] = cpx(26, 33); renderList.push({ y: 33*TS + 12, draw: () => drawBench(b4x, b4y) });

        const drawCafeTable = (cfx, cfy) => {
            X.fillStyle = 'rgba(0,0,0,0.3)'; X.beginPath(); X.ellipse(cfx+8, cfy+12, 10, 4, 0, 0, Math.PI*2); X.fill();
            X.fillStyle = '#ecf0f1'; X.beginPath(); X.ellipse(cfx+8, cfy+8, 8, 3, 0, 0, Math.PI*2); X.fill();
            X.fillRect(cfx+7, cfy+8, 2, 6);
            X.fillStyle = '#c0392b'; X.beginPath(); X.arc(cfx+8, cfy-4, 12, Math.PI, 0); X.fill();
            X.fillStyle = '#ecf0f1'; X.beginPath(); X.arc(cfx+8, cfy-4, 12, Math.PI, 0); X.fill();
            X.fillStyle = '#c0392b'; X.beginPath(); X.arc(cfx+8, cfy-4, 8, Math.PI, 0); X.fill();
            X.fillStyle = '#ecf0f1'; X.beginPath(); X.arc(cfx+8, cfy-4, 4, Math.PI, 0); X.fill();
        };

        const [cf1x, cf1y] = cpx(30, 32); renderList.push({ y: 32*TS + 16, draw: () => drawCafeTable(cf1x, cf1y) });
        const [cf2x, cf2y] = cpx(34, 33); renderList.push({ y: 33*TS + 16, draw: () => drawCafeTable(cf2x, cf2y) });

        const [crX, crY] = cpx(15, 40);
        renderList.push({ y: 40*TS + 30, draw: () => {
            drawCrate(crX+18, crY+20); drawCrate(crX+4, crY+26); drawCrate(crX+14, crY+8);
        }});

        const [cr2X, cr2Y] = cpx(13, 38);
        renderList.push({ y: 38*TS + 30, draw: () => {
            drawCrate(cr2X+4, cr2Y+10); drawCrate(cr2X+18, cr2Y+14);

        pGrd.addColorStop(0, 'rgba(255,255,255,0.12)'); pGrd.addColorStop(1, 'rgba(0,0,0,0)');
        X.fillStyle = pGrd; X.beginPath(); X.arc(ptx, pty, 82, 0, Math.PI*2); X.fill();

    if(currentMap !== 'city') {

    for(const l of lightSources) {
        if(l.x < -l.r || l.x > GW+l.r || l.y < -l.r || l.y > GH+l.r) continue;
        let g = X.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
        g.addColorStop(0, l.c); g.addColorStop(1, 'rgba(0,0,0,0)');
        X.fillStyle = g; X.beginPath(); X.arc(l.x, l.y, l.r, 0, Math.PI*2); X.fill();

    let pGrd = X.createRadialGradient(ptx, pty, 0, ptx, pty, 80);

    X.fillStyle = pGrd; X.beginPath(); X.arc(ptx, pty, 80, 0, Math.PI*2); X.fill();

function drawFootprints(cx, cy) {
    if(currentMap !== 'city') return;
    X.save();
    for(let i = footprints.length - 1; i >= 0; i--) {
        const fp = footprints[i];
        let dx = fp.x * TS - cx, dy = fp.y * TS - cy;
        X.fillStyle = `rgba(160, 130, 100, ${(fp.life / 600) * 0.6})`;
        X.beginPath(); X.ellipse(dx+8, dy+12, 4, 2, 0, 0, Math.PI*2); X.fill();

        fp.life--;
        if(fp.life <= 0) footprints.splice(i, 1);
    }
    X.restore();
}

function updateDrawParticles(dpx, dpy, cx, cy) {
    if (currentMap === 'city' && particles.length < 50 && Math.random() < 0.06) {
        particles.push({
            type: 'seagull', x: Math.random() > 0.5 ? -20 : GW + 20, y: Math.random() * (GH * 0.5),
            vx: (Math.random() * 0.8 + 0.4) * (Math.random() > 0.5 ? 1 : -1), vy: (Math.random() - 0.5) * 0.3, frame: Math.random() * 10
        });
    }

    if (Math.random() < (currentMap === 'city' ? 0.3 : 0.15)) {
        particles.push({ 
            type: 'dust', 
            x: Math.random() * GW, 
            y: Math.random() * GH, 
            vx: currentMap === 'city' ? (Math.random() * 0.6 + 0.2) : (Math.random() * 0.2 - 0.1), 
            vy: currentMap === 'city' ? (-Math.random() * 0.2) : (-Math.random() * 0.1 - 0.05), 
            a: Math.random() * 0.6 + 0.2, 
            life: Math.random() * 60 + 30 
        });
    }

    X.save();
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.type === 'seagull') {
            p.x += p.vx; p.y += p.vy; p.frame += 0.15;
            if (p.x < -30 || p.x > GW + 30 || p.y < -30) { particles.splice(i, 1); continue; }

            X.fillStyle = 'rgba(0,0,0,0.15)';
            X.beginPath(); X.ellipse(p.x, p.y + 25, 6, 2, 0, 0, Math.PI*2); X.fill();

            X.strokeStyle = 'rgba(255, 220, 180, 0.9)'; X.lineWidth = 1.5; X.lineCap = "round";
            X.beginPath(); const wy = Math.sin(p.frame) * 4;
            X.moveTo(p.x - 6, p.y - wy); X.quadraticCurveTo(p.x - 3, p.y, p.x, p.y + 2); X.quadraticCurveTo(p.x + 3, p.y, p.x + 6, p.y - wy); X.stroke();
        } else {
            p.x += p.vx; p.y += p.vy; p.a -= 0.01; p.life--;
            if (p.a <= 0 || p.life <= 0) { particles.splice(i, 1); continue; }
            X.globalAlpha = p.a; X.fillStyle = currentMap === 'city' ? '#ffb347' : '#ffffff'; X.fillRect(p.x, p.y, 1.5, 1.5);
        }
    }

    for(let i = ripples.length - 1; i >= 0; i--) {
        let r = ripples[i];
        X.strokeStyle = `rgba(255,255,255, ${1 - r.life})`;
        X.lineWidth = 2;
        X.beginPath(); X.ellipse(r.x - cx, r.y - cy, r.r, r.r*0.5, 0, 0, Math.PI*2); X.stroke();
        r.r += 0.8; r.life += 0.02;
        if(r.life >= 1) ripples.splice(i, 1);
    }
    X.restore();
}

// --- メインループ ---
function loop() {
    TK++;

    JX.clearRect(0,0,120,120); JX.fillStyle="rgba(25,25,55,.45)"; JX.strokeStyle="rgba(80,100,180,.25)"; JX.lineWidth=2;
    JX.beginPath(); JX.arc(60,60,48,0,Math.PI*2); JX.fill(); JX.stroke();
    JX.fillStyle=jAct?"rgba(255,160,80,.6)":"rgba(200,120,60,.4)"; JX.strokeStyle=jAct?"rgba(255,180,100,.6)":"rgba(255,150,80,.3)";
    JX.beginPath(); JX.arc(60+jx, 60+jy, 18, 0, Math.PI*2); JX.fill(); JX.stroke();

    let dir = null;
    if(Math.abs(jx)>12 || Math.abs(jy)>12) dir = Math.abs(jx)>Math.abs(jy) ? (jx>0?'r':'l') : (jy>0?'d':'u');
    if(keys.ArrowUp||keys.w) dir="u"; if(keys.ArrowDown||keys.s) dir="d";
    if(keys.ArrowLeft||keys.a) dir="l"; if(keys.ArrowRight||keys.d) dir="r";

    const prevMvT = mvT;
    if(mvT <= 0) {
        if(dir) {
            face = dir;
            let nx = px, ny = py;
            if(dir === "u") ny--; if(dir === "d") ny++;
            if(dir === "l") nx--; if(dir === "r") nx++;
            if(canW(nx, ny)) { opx = px; opy = py; px = nx; py = ny; mvT = 140; }
        }
    } else {
        mvT -= 16;
        if(mvT <= 0) {
            mvT = 0;
            const portal = portals.find(p => p.from === currentMap && p.x === px && p.y === py);
            if(portal) {
                currentMap = portal.to;
                px = portal.tx; py = portal.ty;
                opx = px; opy = py;
                particles = [];
                if(currentMap !== 'city') ripples = [];
            }
        }
    }

    if(currentMap === 'city' && prevMvT > 0 && mvT <= 0 && getT(opx, opy) === 11) {
        footprints.push({x: opx, y: opy, life: 600});
    }

    const t2 = mvT > 0 ? Math.max(0, 1 - mvT / 140) : 1;
    const dpx = opx + (px - opx) * t2;
    const dpy = opy + (py - opy) * t2;
    const rawCx = dpx * TS - GW / 2 + TS / 2;
    const rawCy = dpy * TS - GH / 2 + TS / 2;

    const m = MAPS[currentMap];
    const mw = m.w * TS, mh = m.h * TS;
    const cx = (mw <= GW) ? -((GW - mw) / 2) : Math.max(0, Math.min(rawCx, mw - GW));
    const cy = (mh <= GH) ? -((GH - mh) / 2) : Math.max(0, Math.min(rawCy, mh - GH));

    window.currentCamX = cx; window.currentCamY = cy;

    X.fillStyle = currentMap === 'city' ? "#0c1622" : ((currentMap === 'r3' || currentMap === 'snow') ? "#dfeaf7" : "#0d131f"); X.fillRect(0, 0, GW, GH);
    lightSources = [];

    for(let y = Math.max(0, ~~(cy/TS)-1); y < Math.min(m.h, ~~(cy/TS)+GH/TS+2); y++){
        for(let x = Math.max(0, ~~(cx/TS)-1); x < Math.min(m.w, ~~(cx/TS)+GW/TS+2); x++){
            drawTile(~~(x*TS-cx), ~~(y*TS-cy), getT(x,y), x, y);
        }
    }

    drawBackgroundEffects(cx, cy);
    drawFootprints(cx, cy);

    drawObjects(cx, cy, dpx, dpy);

    drawLighting(cx, cy, dpx, dpy);
    updateDrawParticles(dpx, dpy, cx, cy);

    // 画面全体のオーバーレイUI
    if(currentMap === 'ship' || currentMap === 'r3' || currentMap === 'snow') {
        const labels = { ship: 'しらゆき号 船内ロビー', r3: 'しらゆき桟橋 → ゆきみち', snow: 'スノーヴィレッジ 入口広場' };
        X.fillStyle = 'rgba(0, 0, 0, 0.22)'; X.fillRect(12, 12, 150, 28);
        X.fillStyle = currentMap === 'ship' ? '#ffd9a3' : '#eef6ff'; X.font = "12px sans-serif"; X.textAlign = "left";
        X.fillText(labels[currentMap], 22, 30);
        const vig=X.createRadialGradient(GW/2,GH/2,GW*.48,GW/2,GH/2,GW);
        vig.addColorStop(0,"rgba(0,0,0,0)");
        vig.addColorStop(1, currentMap === 'ship' ? "rgba(0,0,0,.72)" : "rgba(70,95,130,.22)");
        X.fillStyle=vig; X.fillRect(0,0,GW,GH);
    } else {
        const vig=X.createRadialGradient(GW/2,GH/2,GW*.4,GW/2,GH/2,GW);
        vig.addColorStop(0,"rgba(0,0,0,0)"); 
        vig.addColorStop(1, currentMap === 'city' ? "rgba(0,0,0,.6)" : "rgba(0,0,0,.85)");
        X.fillStyle=vig; X.fillRect(0,0,GW,GH);
    }

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
